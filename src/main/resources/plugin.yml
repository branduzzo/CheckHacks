name: CheckHacks
version: 1.4.0
main: me.branduzzo.checkHacks.CheckHacksPlugin
api-version: '1.21'
folia-supported: true
description: Detects client-side hacks, mods, clients and brands via the Sign Translation Vulnerability and plugin channels.
authors: [branduzzo]

softdepend:
  - PlaceholderAPI
  - GrimAC
  - Vulcan
  - Spartan
  - Matrix

commands:
  checkhacks:
    description: Check a player for installed hacks/mods.
    usage: /checkhacks <player> [hack1,hack2,...]
    permission: checkhacks.check
  checkclient:
    description: Run any combination of client checks (brand, modlist, hack, lang).
    usage: /checkclient <player> [brand,modlist,...] | /checkclient list | /checkclient info <player>
    permission: checkhacks.checkclient
    aliases: [ccheck, checkany]
  checkbrand:
    description: Check a player's client brand.
    usage: /checkbrand <player>
    permission: checkhacks.checkbrand
    aliases: [cbrand, clientbrand]
  checkmods:
    description: List the mods a player has using their plugin channels.
    usage: /checkmods <player>
    permission: checkhacks.checkmods
    aliases: [cmods, modlist, checkmodlist]
  chreload:
    description: Reload CheckHacks configuration.
    usage: /chreload
    permission: checkhacks.reload
  chalerts:
    description: Toggle hack detection alerts.
    usage: /chalerts
    permission: checkhacks.alerts
    aliases: [checkalerts, alerts]
  checklang:
    description: Check the language of a player.
    usage: /checklang <player> [lang1,lang2,...]
    permission: checkhacks.checklang
  cheditor:
    description: Open the CheckHacks web editor.
    usage: /cheditor
    permission: checkhacks.editor
  checkhacksupdate:
    description: Download the latest CheckHacks update.
    usage: /checkhacksupdate
    permission: checkhacks.update

permissions:
  checkhacks.check:
    description: Use /checkhacks.
    default: op
  checkhacks.checkclient:
    description: Use /checkclient and run combined client checks.
    default: op
  checkhacks.checkbrand:
    description: Use /checkbrand.
    default: op
  checkhacks.checkmods:
    description: Use /checkmods.
    default: op
  checkhacks.reload:
    description: Use /chreload.
    default: op
  checkhacks.alerts:
    description: Receive alerts and use /chalerts.
    default: op
  checkhacks.checklang:
    description: Use /checklang.
    default: op
  checkhacks.editor:
    description: Use /cheditor.
    default: op
  checkhacks.update:
    description: Receive update notifications and download updates.
    default: op
  checkhacks.*:
    description: All CheckHacks permissions.
    default: false
    children:
      checkhacks.check: true
      checkhacks.checkclient: true
      checkhacks.checkbrand: true
      checkhacks.checkmods: true
      checkhacks.reload: true
      checkhacks.alerts: true
      checkhacks.checklang: true
      checkhacks.editor: true
      checkhacks.update: true
