      display-name: "Wurst"
      key: "key.wurst.zoom"
      mode: KEYBIND

    xray-fabric:
      display-name: "XRay"
      key: "xray.config.toggle"
      mode: KEYBIND

    chestesp:
      display-name: "ChestESP"
      key: "key.chestesp.toggle"
      mode: KEYBIND

    killaura-fabric:
      display-name: "KillAura"
      key: "key.killaura"
      mode: KEYBIND

