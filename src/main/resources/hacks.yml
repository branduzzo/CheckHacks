    bleachhack:
      display-name: "BleachHack"
      key: "bleachhack.module.killaura"
      mode: TRANSLATE

    aristois:
      display-name: "Aristois"
      key: "emc.module.killaura.name"
      mode: TRANSLATE

    coffee:
      display-name: "Coffee Client"
      key: "coffee.module.killaura.name"
      mode: TRANSLATE

    accurate-block-placement:
      display-name: "Accurate Block Placement"
      key: "net.clayborn.accurateblockplacement.modplacementmodemessage"
      mode: TRANSLATE

    world-downloader:
      display-name: "World Downloader"
      key: "key.wdl.startStop"
      mode: TRANSLATE

    autoclicker-fabric:
      display-name: "AutoClicker"
      key: "autoclicker-fabric.hud.holding"
      mode: TRANSLATE

    antiafk:
      display-name: "AntiAFK"
      key: "key.antiafk.toggle"
      mode: TRANSLATE

    auto-clicker-mc:
      display-name: "Auto Clicker MC"
      key: "key.auto-clicker_.toggle"
      mode: KEYBIND

    trouser-streak:
      display-name: "Trouser Streak"
      key: "addon.trouser-streak.name"
      mode: TRANSLATE

    ui-utils:
      display-name: "UI Utils"
      key: "key.ui-utils.restore_screen"
      mode: TRANSLATE

    seeedcrackerx:
      display-name: "SeedCrackerX"
      key: "cracker.already"
      mode: TRANSLATE

    simple-world-downloader:
