hacks:
  meteor-client:
    display-name: "Meteor Client"
    key: "key.meteor-client.open-gui"
    mode: METEOR
    match: "meteor"

  meteor-category:
    display-name: "Meteor Client (category)"
    key: "key.category.meteor-client.meteor-client"
    mode: TRANSLATE
    match: "meteor"

  liquidbounce:
    display-name: "LiquidBounce"
    key: "liquidbounce.module.killaura.name"
    mode: TRANSLATE
    match: "killaura,kill aura,liquid"

  freecam:
    display-name: "FreeCam"
    key: "key.freecam.toggle"
    mode: TRANSLATE
    match: "free,cam"

  zergatul-freecam:
    display-name: "Zergatul FreeCam"
    key: "key.zergatul.freecam.toggle"
    mode: TRANSLATE
    match: "free,cam,zergatul"

  easy-freecam:
    display-name: "Easy Freecam"
    key: "key.easy-freecam.toggle_freecam"
    mode: TRANSLATE
    match: "free,cam"

  spectator-freecam:
    display-name: "Spectator Freecam"
    key: "key.freecam.toggle_freecam"
    mode: TRANSLATE
    match: "free,cam,spectat"

  tweakeroo:
    display-name: "Tweakeroo"
    key: "tweakeroo.config.feature_toggle.prettyName.tweakFreeCamera"
    mode: TRANSLATE
    match: "free,camera"

  baritone:
    display-name: "Baritone"
    key: "key.baritone.cancel"
    mode: TRANSLATE
    match: "baritone,cancel"

  cheatutils:
    display-name: "CheatUtils"
    key: "key.zergatul.cheatutils.reserved0"
    mode: TRANSLATE
    match: "reserved 0"

  xray-fabric:
    display-name: "XRay (Fabric)"
    key: "xray.config.toggle"
    mode: TRANSLATE
    match: "xray,x-ray"

  xray-ate48:
    display-name: "X-Ray (ATE48)"
    key: "x13.mod.fullbright"
    mode: TRANSLATE
    match: "fullbright,full bright"

  chestesp:
    display-name: "ChestESP"
    key: "key.chestesp.toggle"
    mode: KEYBIND

  killaura-fabric:
    display-name: "KillAura (Fabric)"
    key: "key.killaura"
    mode: KEYBIND

  autofish:
    display-name: "AutoFish"
    key: "key.autofish.open_gui"
    mode: KEYBIND

  lumina:
    display-name: "Lumina"
    key: "key.lumina.open_click_gui"
    mode: KEYBIND

  autoswitch:
    display-name: "AutoSwitch"
    key: "key.autoswitch.toggle"
    mode: KEYBIND

  bleachhack:
    display-name: "BleachHack"
    key: "bleachhack.module.killaura"
    mode: TRANSLATE

  aristois:
    display-name: "Aristois"
    key: "emc.module.killaura.name"
    mode: TRANSLATE

  coffee:
    display-name: "Coffee Client"
    key: "coffee.module.killaura.name"
    mode: TRANSLATE

  world-downloader:
    display-name: "World Downloader"
    key: "key.wdl.startStop"
    mode: TRANSLATE

  autoclicker-fabric:
    display-name: "AutoClicker (Fabric)"
    key: "autoclicker-fabric.hud.holding"
    mode: TRANSLATE

  antiafk:
    display-name: "AntiAFK"
    key: "key.antiafk.toggle"
    mode: TRANSLATE

  auto-clicker-mc:
    display-name: "Auto Clicker (p1k0chu)"
    key: "key.auto-clicker_.toggle"
    mode: KEYBIND

  wurst:
    display-name: "Wurst Client (-1.21)"
    key: "key.wurst.zoom"
    mode: KEYBIND

  nochatreports:
    display-name: "NoChatReports"
    key: "gui.nochatreports.no_reporting"
    mode: TRANSLATE
    match: "no chat reports,courtesy of"

default-check-hacks:
  - meteor-client
  - meteor-category
  - liquidbounce
  - freecam
  - zergatul-freecam
  - easy-freecam
  - spectator-freecam
  - tweakeroo
  - baritone
  - cheatutils
  - xray-fabric
  - xray-ate48
  - chestesp
  - killaura-fabric
  - autofish
  - lumina
  - autoswitch
  - bleachhack
  - aristois
  - coffee
  - world-downloader
  - autoclicker-fabric
  - antiafk
  - auto-clicker-mc
  - wurst
  - nochatreports

auto-check-on-join:
  enabled: false
  only-first-join: false
  hacks:
    - meteor-client
    - meteor-category
    - liquidbounce
    - freecam
    - zergatul-freecam
    - baritone
    - bleachhack
    - aristois
    - world-downloader
    - autoclicker-fabric
    - antiafk
    - nochatreports

detect-flag:
  enabled: false
  anticheats:
    grim: true
    vulcan: true
    spartan: true
  cooldown-hours: 24
  hacks:
    - meteor-client
    - liquidbounce
    - freecam
    - zergatul-freecam
    - baritone
    - wurst
    - bleachhack
    - aristois
    - world-downloader
    - autoclicker-fabric
    - antiafk
    - nochatreports

command-if-positive:
  enabled: false
  command: "tempban %player% 14d Cheating"

command-if-protected:
  enabled: false
  command: "tempban %player% 14d Cheating"

command-if-clean:
  enabled: false
  command: "give %player% diamond 1"

timeout-ticks: 100
