# Veneer messages (lolcat). Each section below is one part of the plugin.
# Texts are MiniMessage. Keep the {placeholders}; a key you delete falls back to en.yml.

# ======================================================================
# GENERAL
# Shared by every command. {prefix} is general.prefix from config.yml; {player}, {label} and similar are filled in by the plugin.
# ======================================================================
no-permission: "{prefix}<red>U has no permissionz to do dat."
player-not-found: "{prefix}<red>Player <white>{player} <red>not finded."
reload-done: "{prefix}<green>Config reloaded."
alerts-enabled: "{prefix}<green>Alertz enabled."
alerts-disabled: "{prefix}<red>Alertz disabled."
bedrock-skip: "{prefix}<yellow>{player} <gray>iz a Bedrock player - check skipped."
module-not-running: "{prefix}<red>Teh {module} module iz not runnin (check '{module}.enabled' in {module}.yml).</red>"
update-available: "{prefix}<green>Veneer {latest} iz availabl</green> <gray>(runnin {current})</gray> <aqua><click:open_url:'{url}'>{url}</click></aqua>"

# ======================================================================
# MOD SCAN  (/hackcheck, join and anticheat checks)
# Placeholders: {player}. Scan results go to staff with veneer.alerts and to the player who started the scan.
# ======================================================================
check-started: "{prefix}<white>Startin check on <yellow>{player}<white>..."
check-complete: "{prefix}<white>Check complete for <yellow>{player}<white>:"
check-timeout: "{prefix}<yellow>{player} <white>did not reply - marked as <red>TIMEOUT<white>."
doublecheck: "{prefix}<yellow>DoubleCheck<gray>: <white>{player} <gray>iz flagged - runnin comfirm check..."
anticheat-trigger: "{prefix}<gray>Anticheat sez <yellow>{player}<gray> iz sus. Startin auto-check..."
join-check: "{prefix}<gray>Auto-checkin <yellow>{player} <gray>on join..."
already-checking: "{prefix}<yellow>{player} <white>iz already gettin checked."
invalid-hack: "{prefix}<red>Unknown hackz: <white>{hack}"
hackcheck-usage: "{prefix}<red>Usage: /hackcheck \\<player> [hack1,hack2,...]</red>"
hackcheck-no-valid: "{prefix}<red>No valid hackz 2 check.</red>"

# ======================================================================
# MOD SCAN  (result block)
# check-result-line: {hack}, {result}. The result texts are shown as they are; the words match the values kept in the history database.
# check-nothing-found is shown when every mod was clean and hide-clean is on; check-channels shows {channels} when show-channels is on.
# ======================================================================
check-translation-header: "{prefix}<gray>  Translation Detect:"
check-result-line: "{prefix}  <white>{hack}<gray>: {result}"
result-detected: "<red>DETECTED"
result-not-detected: "<green>NOT_DETECTED"
result-protected: "<yellow>PROTECTED"
result-timeout: "<yellow>TIMEOUT"
result-skipped: "<gray>SKIPPED"
check-nothing-found: "{prefix}<green>    Nothing detected"
check-channels: "{prefix}<white>  Channels<gray>: <aqua>{channels}"

# ======================================================================
# LANGUAGE CHECK  (/hacklang)
# Placeholders: {player}, {lang}, {response}.
# ======================================================================
hacklang-usage: "{prefix}<red>Usage: /hacklang \\<player> [lang1,lang2,...]</red>"
hacklang-unknown: "{prefix}<red>Unknown languaj: <white>{lang}</white></red>"
lang-check-started: "{prefix}<white>Checkin language of <yellow>{player}<white>..."
lang-check-complete: "{prefix}<white>Language of <yellow>{player}<white>: <yellow>{lang} <gray>({response})"
lang-check-unknown: "{prefix}<white>Language of <yellow>{player}<white>: <red>Unknon <gray>({response})"
