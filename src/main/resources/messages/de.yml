# Veneer messages (de). Each section below is one part of the plugin.
# Texts are MiniMessage. Keep the {placeholders}; a key you delete falls back to en.yml.

# ======================================================================
# GENERAL
# Shared by every command. {prefix} is general.prefix from config.yml; {player}, {label} and similar are filled in by the plugin.
# ======================================================================
no-permission: "{prefix}<red>Du hast keine Berechtigung, das zu tun."
player-not-found: "{prefix}<red>Spieler <white>{player} <red>nicht gefunden."
reload-done: "{prefix}<green>Konfiguration neu geladen."
alerts-enabled: "{prefix}<green>Warnungen aktiviert."
alerts-disabled: "{prefix}<red>Warnungen deaktiviert."
bedrock-skip: "{prefix}<yellow>{player} <gray>ist ein Bedrock-Spieler - Überprüfung übersprungen."
module-not-running: "{prefix}<red>Das Modul {module} läuft nicht (prüfe '{module}.enabled' in der {module}.yml).</red>"
update-available: "{prefix}<green>Veneer {latest} ist verfügbar</green> <gray>(läuft: {current})</gray> <aqua><click:open_url:'{url}'>{url}</click></aqua>"

# ======================================================================
# MOD SCAN  (/hackcheck, join and anticheat checks)
# Placeholders: {player}. Scan results go to staff with veneer.alerts and to the player who started the scan.
# ======================================================================
check-started: "{prefix}<white>Überprüfung von <yellow>{player}<white> wird gestartet..."
check-complete: "{prefix}<white>Überprüfung für <yellow>{player}<white> abgeschlossen:"
check-timeout: "{prefix}<yellow>{player} <white>hat nicht geantwortet - als <red>ZEITÜBERSCHREITUNG <white>markiert."
doublecheck: "{prefix}<yellow>DoubleCheck<gray>: <white>{player} <gray>markiert - starte Bestätigungsscan..."
anticheat-trigger: "{prefix}<gray>Das Anticheat hat <yellow>{player}<gray> erkannt. Starte automatische Überprüfung..."
join-check: "{prefix}<gray>Automatische Überprüfung von <yellow>{player} <gray>beim Beitritt..."
already-checking: "{prefix}<yellow>{player} <white>wird bereits überprüft."
invalid-hack: "{prefix}<red>Unbekannter Hack: <white>{hack}"
hackcheck-usage: "{prefix}<red>Verwendung: /hackcheck \\<player> [hack1,hack2,...]</red>"
hackcheck-no-valid: "{prefix}<red>Keine gültigen Hacks zum Überprüfen.</red>"

# ======================================================================
# MOD SCAN  (result block)
# check-result-line: {hack}, {result}. The result texts are shown as they are; the words match the values kept in the history database.
# check-nothing-found is shown when every mod was clean and hide-clean is on; check-channels shows {channels} when show-channels is on.
# ======================================================================
check-translation-header: "{prefix}<gray>  Translation Detect:"
check-result-line: "{prefix}  <white>{hack}<gray>: {result}"
result-detected: "<red>DETECTED"
result-not-detected: "<green>NOT_DETECTED"
result-protected: "<yellow>PROTECTED"
result-timeout: "<yellow>TIMEOUT"
result-skipped: "<gray>SKIPPED"
check-nothing-found: "{prefix}<green>    Nichts erkannt"
check-channels: "{prefix}<white>  Kanäle<gray>: <aqua>{channels}"

# ======================================================================
# LANGUAGE CHECK  (/hacklang)
# Placeholders: {player}, {lang}, {response}.
# ======================================================================
hacklang-usage: "{prefix}<red>Verwendung: /hacklang \\<player> [lang1,lang2,...]</red>"
hacklang-unknown: "{prefix}<red>Unbekannte Sprache: <white>{lang}</white></red>"
lang-check-started: "{prefix}<white>Sprache von <yellow>{player}<white> wird überprüft..."
lang-check-complete: "{prefix}<white>Sprache von <yellow>{player}<white>: <yellow>{lang} <gray>({response})"
lang-check-unknown: "{prefix}<white>Sprache von <yellow>{player}<white>: <red>Unbekannt <gray>({response})"
lang-check-protected: "{prefix}<white>Sprache von <yellow>{player}<white>: <yellow>GESCHÜTZT"
lang-check-timeout: "{prefix}<yellow>{player} <white>hat nicht geantwortet - Sprachprüfung fehlgeschlagen."
lang-join-check: "{prefix}<gray>Automatische Sprachprüfung von <yellow>{player}<gray>..."

# ======================================================================
# WEB EDITOR  (/hackeditor)
# Placeholders: {url}.
# ======================================================================
editor-url: "{prefix}<white>Editor: <aqua><click:open_url:'{url}'>{url}</click>"
editor-disabled: "{prefix}<red>Der Web-Editor ist in der hacks.yml deaktiviert."
editor-players-only: "{prefix}<red>Nur Spieler können den Editor öffnen.</red>"

