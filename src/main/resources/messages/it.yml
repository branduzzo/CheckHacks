# Veneer messages (it). Each section below is one part of the plugin.
# Texts are MiniMessage. Keep the {placeholders}; a key you delete falls back to en.yml.

# ======================================================================
# GENERAL
# Shared by every command. {prefix} is general.prefix from config.yml; {player}, {label} and similar are filled in by the plugin.
# ======================================================================
no-permission: "{prefix}<red>Non hai il permesso per farlo."
player-not-found: "{prefix}<red>Giocatore <white>{player} <red>non trovato."
reload-done: "{prefix}<green>Configurazione ricaricata."
alerts-enabled: "{prefix}<green>Avvisi attivati."
alerts-disabled: "{prefix}<red>Avvisi disattivati."
bedrock-skip: "{prefix}<yellow>{player} <gray>è un giocatore Bedrock - controllo saltato."
module-not-running: "{prefix}<red>Il modulo {module} non è in esecuzione (controlla '{module}.enabled' in {module}.yml).</red>"
update-available: "{prefix}<green>Veneer {latest} è disponibile</green> <gray>(in uso {current})</gray> <aqua><click:open_url:'{url}'>{url}</click></aqua>"

# ======================================================================
# MOD SCAN  (/hackcheck, join and anticheat checks)
# Placeholders: {player}. Scan results go to staff with veneer.alerts and to the player who started the scan.
# ======================================================================
check-started: "{prefix}<white>Avvio controllo su <yellow>{player}<white>..."
check-complete: "{prefix}<white>Controllo completato per <yellow>{player}<white>:"
check-timeout: "{prefix}<yellow>{player} <white>non ha risposto - segnato come <red>TIMEOUT<white>."
doublecheck: "{prefix}<yellow>DoubleCheck<gray>: <white>{player} <gray>segnato come sospetto - avvio scansione di conferma..."
anticheat-trigger: "{prefix}<gray>L'anticheat ha segnalato <yellow>{player}<gray>. Avvio controllo automatico..."
join-check: "{prefix}<gray>Controllo automatico di <yellow>{player} <gray>all'entrata..."
already-checking: "{prefix}<yellow>{player} <white>è già in fase di controllo."
invalid-hack: "{prefix}<red>Hack sconosciuto: <white>{hack}"
hackcheck-usage: "{prefix}<red>Uso: /hackcheck \\<player> [hack1,hack2,...]</red>"
hackcheck-no-valid: "{prefix}<red>Nessun hack valido da controllare.</red>"

# ======================================================================
# MOD SCAN  (result block)
# check-result-line: {hack}, {result}. The result texts are shown as they are; the words match the values kept in the history database.
# check-nothing-found is shown when every mod was clean and hide-clean is on; check-channels shows {channels} when show-channels is on.
# ======================================================================
check-translation-header: "{prefix}<gray>  Translation Detect:"
check-result-line: "{prefix}  <white>{hack}<gray>: {result}"
result-detected: "<red>DETECTED"
result-not-detected: "<green>NOT_DETECTED"
result-protected: "<yellow>PROTECTED"
result-timeout: "<yellow>TIMEOUT"
result-skipped: "<gray>SKIPPED"
check-nothing-found: "{prefix}<green>    Niente rilevato"
check-channels: "{prefix}<white>  Canali<gray>: <aqua>{channels}"

# ======================================================================
# LANGUAGE CHECK  (/hacklang)
# Placeholders: {player}, {lang}, {response}.
# ======================================================================
hacklang-usage: "{prefix}<red>Uso: /hacklang \\<player> [lang1,lang2,...]</red>"
hacklang-unknown: "{prefix}<red>Lingua sconosciuta: <white>{lang}</white></red>"
lang-check-started: "{prefix}<white>Controllo lingua di <yellow>{player}<white>..."
lang-check-complete: "{prefix}<white>Lingua di <yellow>{player}<white>: <yellow>{lang} <gray>({response})"
lang-check-unknown: "{prefix}<white>Lingua di <yellow>{player}<white>: <red>Sconosciuta <gray>({response})"
lang-check-protected: "{prefix}<white>Lingua di <yellow>{player}<white>: <yellow>PROTETTO"
lang-check-timeout: "{prefix}<yellow>{player} <white>non ha risposto - controllo lingua fallito."
lang-join-check: "{prefix}<gray>Controllo lingua automatico di <yellow>{player}<gray>..."

# ======================================================================
# WEB EDITOR  (/hackeditor)
# Placeholders: {url}.
# ======================================================================
editor-url: "{prefix}<white>Editor: <aqua><click:open_url:'{url}'>{url}</click>"
editor-disabled: "{prefix}<red>Il web editor è disabilitato nel hacks.yml."
editor-players-only: "{prefix}<red>Solo i giocatori possono aprire l'editor.</red>"

