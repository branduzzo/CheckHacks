# Veneer messages (fr). Each section below is one part of the plugin.
# Texts are MiniMessage. Keep the {placeholders}; a key you delete falls back to en.yml.

# ======================================================================
# GENERAL
# Shared by every command. {prefix} is general.prefix from config.yml; {player}, {label} and similar are filled in by the plugin.
# ======================================================================
no-permission: "{prefix}<red>Vous n'avez pas la permission de faire cela."
player-not-found: "{prefix}<red>Joueur <white>{player} <red>introuvable."
reload-done: "{prefix}<green>Configuration rechargée."
alerts-enabled: "{prefix}<green>Alertes activées."
alerts-disabled: "{prefix}<red>Alertes désactivées."
bedrock-skip: "{prefix}<yellow>{player} <gray>est un joueur Bedrock - vérification ignorée."
module-not-running: "{prefix}<red>Le module {module} n'est pas en cours d'exécution (vérifiez '{module}.enabled' dans {module}.yml).</red>"
update-available: "{prefix}<green>Veneer {latest} est disponible</green> <gray>(version actuelle : {current})</gray> <aqua><click:open_url:'{url}'>{url}</click></aqua>"

# ======================================================================
# MOD SCAN  (/hackcheck, join and anticheat checks)
# Placeholders: {player}. Scan results go to staff with veneer.alerts and to the player who started the scan.
# ======================================================================
check-started: "{prefix}<white>Démarrage de la vérification de <yellow>{player}<white>..."
check-complete: "{prefix}<white>Vérification terminée pour <yellow>{player}<white> :"
check-timeout: "{prefix}<yellow>{player} <white>n'a pas répondu - marqué comme <red>DÉLAI DÉPASSÉ<white>."
doublecheck: "{prefix}<yellow>DoubleCheck<gray> : <white>{player} <gray>signalé - scan de confirmation en cours..."
anticheat-trigger: "{prefix}<gray>L'anticheat a signalé <yellow>{player}<gray>. Démarrage de la vérification automatique..."
join-check: "{prefix}<gray>Vérification automatique de <yellow>{player} <gray>à la connexion..."
already-checking: "{prefix}<yellow>{player} <white>est déjà en cours de vérification."
invalid-hack: "{prefix}<red>Hack inconnu : <white>{hack}"
hackcheck-usage: "{prefix}<red>Utilisation : /hackcheck \\<player> [hack1,hack2,...]</red>"
hackcheck-no-valid: "{prefix}<red>Aucun hack valide à vérifier.</red>"

# ======================================================================
# MOD SCAN  (result block)
# check-result-line: {hack}, {result}. The result texts are shown as they are; the words match the values kept in the history database.
# check-nothing-found is shown when every mod was clean and hide-clean is on; check-channels shows {channels} when show-channels is on.
# ======================================================================
check-translation-header: "{prefix}<gray>  Translation Detect:"
check-result-line: "{prefix}  <white>{hack}<gray>: {result}"
result-detected: "<red>DETECTED"
result-not-detected: "<green>NOT_DETECTED"
result-protected: "<yellow>PROTECTED"
result-timeout: "<yellow>TIMEOUT"
result-skipped: "<gray>SKIPPED"
check-nothing-found: "{prefix}<green>    Rien détecté"
check-channels: "{prefix}<white>  Canaux<gray>: <aqua>{channels}"

# ======================================================================
# LANGUAGE CHECK  (/hacklang)
# Placeholders: {player}, {lang}, {response}.
# ======================================================================
hacklang-usage: "{prefix}<red>Utilisation : /hacklang \\<player> [lang1,lang2,...]</red>"
hacklang-unknown: "{prefix}<red>Langue inconnue : <white>{lang}</white></red>"
lang-check-started: "{prefix}<white>Vérification de la langue de <yellow>{player}<white>..."
lang-check-complete: "{prefix}<white>Langue de <yellow>{player}<white> : <yellow>{lang} <gray>({response})"
lang-check-unknown: "{prefix}<white>Langue de <yellow>{player}<white> : <red>Inconnue <gray>({response})"
lang-check-protected: "{prefix}<white>Langue de <yellow>{player}<white> : <yellow>PROTÉGÉ"
lang-check-timeout: "{prefix}<yellow>{player} <white>n'a pas répondu - échec de la vérification de la langue."
lang-join-check: "{prefix}<gray>Vérification automatique de la langue de <yellow>{player}<gray>..."

# ======================================================================
# WEB EDITOR  (/hackeditor)
# Placeholders: {url}.
# ======================================================================
editor-url: "{prefix}<white>Éditeur : <aqua><click:open_url:'{url}'>{url}</click>"
editor-disabled: "{prefix}<red>L'éditeur web est désactivé dans le hacks.yml."
editor-players-only: "{prefix}<red>Seuls les joueurs peuvent ouvrir l'éditeur.</red>"

