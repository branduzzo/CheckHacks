# Veneer messages (br). Each section below is one part of the plugin.
# Texts are MiniMessage. Keep the {placeholders}; a key you delete falls back to en.yml.

# ======================================================================
# GENERAL
# Shared by every command. {prefix} is general.prefix from config.yml; {player}, {label} and similar are filled in by the plugin.
# ======================================================================
no-permission: "{prefix}<red>Você não tem permissão para fazer isso."
player-not-found: "{prefix}<red>Jogador <white>{player} <red>não encontrado."
reload-done: "{prefix}<green>Configuração recarregada."
alerts-enabled: "{prefix}<green>Alertas ativados."
alerts-disabled: "{prefix}<red>Alertas desativados."
bedrock-skip: "{prefix}<yellow>{player} <gray>é um jogador Bedrock - verificação ignorada."
module-not-running: "{prefix}<red>O módulo {module} não está em execução (verifique '{module}.enabled' em {module}.yml).</red>"
update-available: "{prefix}<green>Veneer {latest} está disponível</green> <gray>(executando {current})</gray> <aqua><click:open_url:'{url}'>{url}</click></aqua>"

# ======================================================================
# MOD SCAN  (/hackcheck, join and anticheat checks)
# Placeholders: {player}. Scan results go to staff with veneer.alerts and to the player who started the scan.
# ======================================================================
check-started: "{prefix}<white>Iniciando verificação em <yellow>{player}<white>..."
check-complete: "{prefix}<white>Verificação concluída para <yellow>{player}<white>:"
check-timeout: "{prefix}<yellow>{player} <white>não respondeu - marcado como <red>TEMPO ESGOTADO<white>."
doublecheck: "{prefix}<yellow>DoubleCheck<gray>: <white>{player} <gray>sinalizado - iniciando verificação de confirmação..."
anticheat-trigger: "{prefix}<gray>O anticheat sinalizou <yellow>{player}<gray>. Iniciando verificação automática..."
join-check: "{prefix}<gray>Verificação automática de <yellow>{player} <gray>ao entrar..."
already-checking: "{prefix}<yellow>{player} <white>já está em verificação."
invalid-hack: "{prefix}<red>Hack desconhecido: <white>{hack}"
hackcheck-usage: "{prefix}<red>Uso: /hackcheck \\<player> [hack1,hack2,...]</red>"
hackcheck-no-valid: "{prefix}<red>Nenhum hack válido para verificar.</red>"

# ======================================================================
# MOD SCAN  (result block)
# check-result-line: {hack}, {result}. The result texts are shown as they are; the words match the values kept in the history database.
# check-nothing-found is shown when every mod was clean and hide-clean is on; check-channels shows {channels} when show-channels is on.
# ======================================================================
check-translation-header: "{prefix}<gray>  Translation Detect:"
check-result-line: "{prefix}  <white>{hack}<gray>: {result}"
result-detected: "<red>DETECTED"
result-not-detected: "<green>NOT_DETECTED"
result-protected: "<yellow>PROTECTED"
result-timeout: "<yellow>TIMEOUT"
result-skipped: "<gray>SKIPPED"
check-nothing-found: "{prefix}<green>    Nada detectado"
check-channels: "{prefix}<white>  Canais<gray>: <aqua>{channels}"

# ======================================================================
# LANGUAGE CHECK  (/hacklang)
# Placeholders: {player}, {lang}, {response}.
# ======================================================================
hacklang-usage: "{prefix}<red>Uso: /hacklang \\<player> [lang1,lang2,...]</red>"
hacklang-unknown: "{prefix}<red>Idioma desconhecido: <white>{lang}</white></red>"
lang-check-started: "{prefix}<white>Verificando idioma de <yellow>{player}<white>..."
lang-check-complete: "{prefix}<white>Idioma de <yellow>{player}<white>: <yellow>{lang} <gray>({response})"
lang-check-unknown: "{prefix}<white>Idioma de <yellow>{player}<white>: <red>Desconhecido <gray>({response})"
lang-check-protected: "{prefix}<white>Idioma de <yellow>{player}<white>: <yellow>PROTEGIDO"
lang-check-timeout: "{prefix}<yellow>{player} <white>não respondeu - verificação de idioma falhou."
lang-join-check: "{prefix}<gray>Verificação automática de idioma de <yellow>{player}<gray>..."

# ======================================================================
# WEB EDITOR  (/hackeditor)
# Placeholders: {url}.
# ======================================================================
editor-url: "{prefix}<white>Editor: <aqua><click:open_url:'{url}'>{url}</click>"
editor-disabled: "{prefix}<red>O editor web está desativado no hacks.yml."
editor-players-only: "{prefix}<red>Apenas jogadores podem abrir o editor.</red>"

