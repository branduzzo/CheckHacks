<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veneer | Panel</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{
          --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
          --blue:#4493f8;--blue-dim:#1f3a5c;--text:#e6edf3;--text2:#8b949e;
          --green:#3fb950;--red:#f85149;--yellow:#d29922;--gray:#484f58;
          --radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif
        }
        body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
        header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;gap:16px;flex-shrink:0}
        .logo{font-weight:700;font-size:16px;color:var(--text)}
        .logo span{color:var(--blue)}
        .header-spacer{flex:1}
        .home-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:var(--radius);cursor:pointer;font-size:13px;font-family:var(--font);transition:all .15s}
        .home-btn:hover{border-color:var(--blue);color:var(--text)}
        .player-badge{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:13px;margin-left:8px}
        .player-badge img{border-radius:4px;image-rendering:pixelated;width:24px;height:24px}
        .layout{display:grid;grid-template-columns:240px 1fr 260px;flex:1;overflow:hidden}
        .layout.wide{grid-template-columns:1fr}
        .layout.wide > .panel{display:none}
        .panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
        .panel-right{border-right:none;border-left:1px solid var(--border)}
        .panel-title{padding:12px 16px 10px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);flex-shrink:0}
        .search-wrap{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
        .search-wrap input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:7px 10px;font-size:13px;font-family:var(--font);outline:none;transition:border-color .15s}
        .search-wrap input:focus{border-color:var(--blue)}
        .search-wrap input::placeholder{color:var(--text2)}
        .search-wrap button{width:100%;margin-top:6px;background:var(--blue-dim);border:1px solid var(--blue);color:var(--blue);border-radius:var(--radius);padding:7px;cursor:pointer;font-size:13px;font-family:var(--font);transition:all .15s}
        .search-wrap button:hover{background:var(--blue);color:#fff}
        .panel-scroll{flex:1;overflow-y:auto;padding:6px}
        .panel-scroll::-webkit-scrollbar{width:4px}
        .panel-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
        .player-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius);cursor:pointer;transition:background .12s;border:1px solid transparent}
        .player-item:hover{background:var(--surface2);border-color:var(--border)}
        .player-item img{border-radius:3px;image-rendering:pixelated;flex-shrink:0;width:28px;height:28px;background:var(--surface2)}
        .player-item-name{font-size:13px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .online-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
        .scan-item{padding:9px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--border);margin-bottom:5px;background:var(--bg);transition:border-color .12s}
        .scan-item:hover{border-color:var(--blue)}
        .scan-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
        .scan-item-name{font-weight:600;font-size:12px;color:var(--text)}
        .scan-item-time{font-size:11px;color:var(--text2)}
        .scan-item-meta{font-size:11px;color:var(--text2)}
        main{overflow-y:auto;padding:20px;background:var(--bg)}
        main::-webkit-scrollbar{width:5px}
        main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
        .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
        .stat-card-num{font-size:26px;font-weight:700;color:var(--text);line-height:1}
        .stat-card-label{font-size:11px;color:var(--text2);margin-top:3px}
        .section-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
        .player-header{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
        .player-header img{border-radius:6px;image-rendering:pixelated;width:64px;height:64px;background:var(--surface2)}
        .player-header-info h2{font-size:20px;font-weight:700;color:var(--text)}
        .player-header-info p{font-size:11px;color:var(--text2);margin-top:2px;font-family:monospace}
        .online-badge{display:inline-flex;align-items:center;gap:4px;background:#1a2e1a;border:1px solid #2d5a2d;color:var(--green);border-radius:20px;padding:2px 9px;font-size:11px;margin-top:5px}
        .offline-badge{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:20px;padding:2px 9px;font-size:11px;margin-top:5px}
        .scan-cards{display:flex;flex-direction:column;gap:8px}
        .scan-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:border-color .15s}
        .scan-card:hover{border-color:var(--blue)}
        .scan-card-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .scan-card-meta{font-size:11px;color:var(--text2);padding:6px 14px;border-bottom:1px solid var(--border)}
        .scan-card-type{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--blue)}
        .scan-card-time{font-size:11px;color:var(--text2)}
        .results-table{width:100%;border-collapse:collapse}
        .results-table th{text-align:left;padding:8px 14px;font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
        .results-table td{padding:8px 14px;border-bottom:1px solid var(--border);font-size:13px}
        .results-table tr:last-child td{border-bottom:none}
        .badge{display:inline-flex;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600}
        .badge-DETECTED{background:#3d1a1a;border:1px solid #7c2020;color:var(--red)}
        .badge-NOT_DETECTED{background:#1a2e1a;border:1px solid #2d5a2d;color:var(--green)}
        .badge-PROTECTED{background:#2e2410;border:1px solid #5a3d10;color:var(--yellow)}
        .badge-SKIPPED{background:var(--surface2);border:1px solid var(--border);color:var(--gray)}
        .badge-lang{background:var(--blue-dim);border:1px solid var(--blue);color:var(--blue)}
        .empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
        .loading{text-align:center;padding:28px;color:var(--text2);font-size:13px}
        .back-btn{background:none;border:1px solid var(--border);color:var(--text2);border-radius:var(--radius);padding:6px 12px;cursor:pointer;font-size:13px;font-family:var(--font);margin-bottom:14px;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
        .back-btn:hover{border-color:var(--blue);color:var(--text)}
        .run-btn{background:var(--blue-dim);border:1px solid var(--blue);color:var(--blue);border-radius:var(--radius);padding:7px 14px;cursor:pointer;font-size:13px;font-family:var(--font);transition:all .15s;margin-bottom:14px;margin-right:8px}
        .run-btn:hover{background:var(--blue);color:#fff}
        .run-btn:disabled{opacity:.4;cursor:not-allowed}
        .toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--green);color:var(--green);padding:10px 16px;border-radius:var(--radius);font-size:13px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
        .toast.show{opacity:1}
        .error-msg{color:var(--red);font-size:12px;padding:8px 0}
        .graph-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
        .graph-bar input{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:6px 10px;font-size:13px;font-family:var(--font);outline:none}
        .graph-bar select{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:5px 6px;font-size:12px;font-family:var(--font)}
        .graph-bar label{color:var(--text2);font-size:12px;display:flex;gap:4px;align-items:center}
        .graph-box{height:calc(100vh - 150px);min-height:360px;border:1px solid var(--border);border-radius:var(--radius);background:#05080d;position:relative;overflow:hidden}
        .graph-info{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--text2);display:flex;gap:16px;align-items:center}
        .graph-info .legend{font-size:11px}
        .legend .sq{display:inline-block;width:10px;height:10px;border:3px solid;border-radius:2px;margin:0 4px 0 12px;vertical-align:-1px}
        .legend i{display:inline-block;width:16px;border-top:3px solid;margin:0 4px 0 12px;vertical-align:3px}
        .dbg-log{position:absolute;left:10px;top:10px;width:520px;max-height:260px;overflow:auto;margin:0;padding:8px 10px;background:#0d1117e6;border:1px solid var(--border);border-radius:var(--radius);color:#7ee787;font:11px/1.45 monospace;z-index:6;white-space:pre-wrap;pointer-events:none}
        .graph-info{z-index:3}
        .node-card{position:absolute;top:12px;right:12px;width:270px;max-height:calc(100% - 24px);overflow-y:auto;background:#161b22f2;border:1px solid var(--border);border-radius:var(--radius);padding:14px;z-index:5;font-size:12px}
        .node-card h3{font-size:16px;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
        .node-card h3 button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px}
        .node-card h4{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin:12px 0 5px}
        .node-card .row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--border);color:var(--text)}
        .node-card .row span:last-child{color:var(--text2);white-space:nowrap}
        .node-card .alt{cursor:pointer}.node-card .alt:hover{color:var(--blue)}
        .node-card .bits{font-family:monospace;letter-spacing:1px;color:var(--text)}
        .badge-TIMEOUT{background:#2a2135;border:1px solid #4b3a63;color:#a371f7}
        .stat-row.wide{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
        .stat-card.link{cursor:pointer;transition:border-color .15s}.stat-card.link:hover{border-color:var(--blue)}
        .danger-btn{background:#3d1a1a;border:1px solid #7c2020;color:var(--red);border-radius:var(--radius);padding:6px 12px;cursor:pointer;font-size:13px;font-family:var(--font);transition:all .15s;margin-left:8px}
        .danger-btn:hover{background:var(--red);color:#fff}
        .toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin-bottom:6px}
        .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:18px}
        .info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-size:12px;min-width:0}
        .info-card h4{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:8px}
        .kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--border)}
        .kv:last-child{border-bottom:none}
        .kv span:first-child{color:var(--text2)}
        .kv span:last-child{color:var(--text);text-align:right;overflow-wrap:anywhere}
        .kv small{display:block;color:var(--text2);font-size:10px}
        .kv.alt{cursor:pointer}.kv.alt:hover span:first-child{color:var(--blue)}
        .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
        .chip{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font:11px monospace;color:var(--text2)}
        .muted{color:var(--text2)}
        .warn{color:var(--yellow)}
        .more-btn{display:block;margin:12px auto 0;background:none;border:1px solid var(--border);color:var(--text2);border-radius:var(--radius);padding:7px 18px;cursor:pointer;font-family:var(--font)}
        .more-btn:hover{border-color:var(--blue);color:var(--text)}
        .scan-item.hit,.scan-card.hit{border-left:3px solid var(--red)}
        .session{font-size:11px;color:var(--text2);border:1px solid var(--border);border-radius:20px;padding:2px 9px}
        .session.low{color:var(--yellow);border-color:#5a3d10}
        .no-links .links-btn, .no-scan .run-btn, .no-delete .danger-btn { display: none; }
        @media (max-width: 900px) {
          body{height:auto;min-height:100vh;overflow:auto}
          header{height:auto;flex-wrap:wrap;padding:8px 12px;gap:8px}
          .header-spacer{display:none}
          .layout{display:flex;flex-direction:column;overflow:visible}
          main{overflow:visible;padding:14px 12px;order:1}
          .panel{order:2;border-right:none;border-top:1px solid var(--border);max-height:360px}
          .layout.wide > .panel{display:none}
          .stat-row{grid-template-columns:repeat(2,1fr)}
          .graph-box{height:70vh}
          .node-card{width:auto;left:12px}
          .dbg-log{width:auto;right:10px}
        }
</style>
</head>
<body>
<header>
    <span class="logo">Vene<span>er</span> Panel</span>
    <div class="header-spacer"></div>
    <span class="session" id="session"></span>
    <div class="player-badge" id="player-badge"></div>
    <button class="home-btn" onclick="nav('history')" data-t="☰ History">☰ History</button>
    <button class="home-btn" onclick="nav('mods')" data-t="☢ Mods detected">☢ Mods detected</button>
    <button class="home-btn links-btn" onclick="nav('links')" data-t="⚯ Links">⚯ Links</button>
    <button class="home-btn" onclick="nav('home')" data-t="⌂ Home">⌂ Home</button>
</header>
<div class="layout">
    <aside class="panel">
        <div class="panel-title" data-t="Players">Players</div>
        <div class="search-wrap">
            <input type="text" id="search-input" list="search-list" autocomplete="off" placeholder="Search player..." data-tp="Search player..." onkeydown="if(event.key==='Enter')searchPlayer()">
            <datalist id="search-list"></datalist>
            <button onclick="searchPlayer()" data-t="Search">Search</button>
        </div>
        <div class="panel-scroll" id="offline-history"></div>
    </aside>
    <main id="main-content">
        <div class="loading" data-t="Loading...">Loading...</div>
    </main>
    <aside class="panel panel-right">
        <div class="panel-title" data-t="Recent Scans">Recent Scans</div>
        <div class="panel-scroll" id="recent-scans"></div>
        <div class="panel-title" style="border-top:1px solid var(--border)" data-t="Online Players">Online Players</div>
        <div style="height:220px;overflow-y:auto;padding:6px;flex-shrink:0" id="online-players"></div>
    </aside>
</div>
<div class="toast" id="toast"></div>
<script src="/web/three.min.js"></script>
<script src="/web/3d-force-graph.min.js"></script>
<script>
    const token = new URLSearchParams(location.search).get('token');
    // Translations for general.language, put in by the server (web/lang/<language>.json): English text -> text.
    // Missing entries and English stay as written; {0}, {1}... are filled from the arguments.
    const L = /*I18N*/{};
    function t(text, ...args) {
      return String(L[text] || text).replace(/\{(\d+)\}/g, (m, i) => args[i] !== undefined ? args[i] : m);
    }

    function apiUrl(path) {
      const sep = path.includes('?') ? '&' : '?';
      return '/api/' + path + sep + 'token=' + encodeURIComponent(token);
    }

    let expired = false;
    async function apiFetch(path, opts) {
      if (expired) throw new Error(t('Session expired. Run /hackeditor in Minecraft.'));
      const r = await fetch(apiUrl(path), opts || {});
      const text = await r.text();
      let json;
      try { json = JSON.parse(text); } catch(e) { throw new Error('Invalid JSON: ' + text.slice(0,100)); }
      if (r.status === 401) { sessionExpired(); throw new Error(t('Session expired. Run /hackeditor in Minecraft.')); }
      if (!r.ok) throw new Error(json.error || r.status);
      return json;
    }

    function sessionExpired() {
      // Timers keep calling the API: draw the notice once
      if (expired) return;
      expired = true;
      stopGraph();
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#8b949e;font-size:14px">' + esc(t('Session expired. Run /hackeditor in Minecraft.')) + '</div>';
    }

    // Pages live in the address hash (#player/Name, #scan/12, ...), so the browser's back button and reload work
    function nav(route) {
      if (location.hash.slice(1) === route) render(); else location.hash = route;
    }
    function render() {
      const h = location.hash.slice(1), i = h.indexOf('/');
      const page = i < 0 ? h : h.slice(0, i), arg = i < 0 ? '' : decodeURIComponent(h.slice(i + 1));
      document.querySelector('.layout').classList.toggle('wide', page === 'links' && perms.includes('links'));
      if (page === 'player' && arg) showPlayer(arg);
      else if (page === 'scan' && arg) showScan(+arg);
      else if (page === 'mods') showMods();
      else if (page === 'history') showHistory();
      else if (page === 'links' && perms.includes('links')) showLinks(arg);
      else showHome();
    }
    window.addEventListener('hashchange', render);
    const playerRoute = name => 'player/' + encodeURIComponent(name);
    let perms = [];

    async function apiPost(path, body) {
      return apiFetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    let offlineHistory = [];
    try { offlineHistory = JSON.parse(localStorage.getItem('ch_history') || '[]'); } catch(e) {}

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function timeAgo(ts) {
      const d = Date.now() - Number(ts);
      if (d < 60000) return t('just now');
      if (d < 3600000) return t('{0}m ago', Math.floor(d/60000));
      if (d < 86400000) return t('{0}h ago', Math.floor(d/3600000));
      return new Date(Number(ts)).toLocaleDateString();
    }

    function headUrl(id) {
      return 'https://mc-heads.net/avatar/' + encodeURIComponent(id) + '/32';
    }

    function badge(result) {
      const r = esc(String(result || 'SKIPPED').toUpperCase());
      return '<span class="badge badge-' + r + '">' + r + '</span>';
    }

    async function init() {
      document.documentElement.lang = L._lang || 'en';
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
      document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = t(el.dataset.tp); });
      try {
        const info = await apiFetch('validate');
        // The server refuses what the token has no right to; hide those controls so they are not offered
        perms = String(info.perms || '').split(',');
        document.body.classList.toggle('no-links', !perms.includes('links'));
        document.body.classList.toggle('no-scan', !perms.includes('scan'));
        document.body.classList.toggle('no-delete', !perms.includes('delete'));
        document.getElementById('player-badge').innerHTML =
          '<img src="' + headUrl(info.player_uuid) + '" onerror="this.style.visibility=\'hidden\'" alt=""> ' + esc(info.player_name);
        startSessionClock(Number(info.expires_at) || 0);
      } catch(e) {
        sessionExpired();
        return;
      }
      render();
      loadOnlinePlayers();
      loadRecentScans();
      renderOfflineHistory();
      setInterval(loadOnlinePlayers, 10000);
      setInterval(loadRecentScans, 15000);
      const input = document.getElementById('search-input');
      let suggestTimer = 0;
      input.addEventListener('input', () => {
        clearTimeout(suggestTimer);
        suggestTimer = setTimeout(() => suggestPlayers(input.value.trim()), 200);
      });
    }

    // Minutes left on the token; the page goes to the expired screen when it runs out
    function startSessionClock(expiresAt) {
      const el = document.getElementById('session');
      if (!expiresAt) { el.style.display = 'none'; return; }
      const tick = () => {
        const left = expiresAt - Date.now();
        if (left <= 0) { clearInterval(timer); sessionExpired(); return; }
        const min = Math.ceil(left / 60000);
        el.textContent = t('session: {0} min', min);
        el.classList.toggle('low', min <= 2);
      };
      const timer = setInterval(tick, 15000);
      tick();
    }

    async function suggestPlayers(q) {
      const list = document.getElementById('search-list');
      if (!q) { list.innerHTML = ''; return; }
      try {
        const found = await apiFetch('players/search?q=' + encodeURIComponent(q));
        list.innerHTML = found.map(p => '<option value="' + esc(p.name) + '">').join('');
      } catch(e) {}
    }


    let graph3d = null, graphRaf = 0;

    // Stops the graph completely: our label loop, the library's render loop, GPU buffers and the WebGL context.
    // Without this every rebuild (filter toggle) and every tab switch leaves a live renderer behind, and the
    // browser starts dropping contexts after about 16 of them.
    function stopGraph() {
      if (graphRaf) cancelAnimationFrame(graphRaf);
      graphRaf = 0;
      if (!graph3d) return;
      const g = graph3d;
      graph3d = null;
      try {
        g.scene().traverse(o => {
          if (o.geometry) o.geometry.dispose();
          [].concat(o.material || []).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });

    // Cube with the player's skin on it: six faces cut from the 64x64 skin, hat layer drawn over the head layer
    const FACES = [ // BoxGeometry order +x -x +y -y +z -z (player's left, right, top, bottom, front, back)
      [16, 8], [0, 8], [8, 0], [16, 0], [8, 8], [24, 8]
    ];
    // Text as a 3D sprite: always faces the camera, shrinks with distance, and heads in front hide it
    function textSprite(text, height, colour) {
      const c = document.createElement('canvas'), g = c.getContext('2d');
      const font = '600 48px system-ui, -apple-system, Segoe UI, sans-serif';
      g.font = font;
      c.width = Math.ceil(g.measureText(text).width) + 20; c.height = 64;
      g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 8; g.strokeStyle = 'rgba(0,0,0,.85)'; g.lineJoin = 'round';
      g.strokeText(text, c.width / 2, 33);

      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map: t, color: colour, transparent: true, depthWrite: false}));
      sprite.scale.set(height * c.width / c.height, height, 1);

    }

    function skinCube(n, size) {
      const edge = size, colour = n.detected ? 0xf85149 : 0x4493f8;
      const group = new THREE.Group();
      const canvases = FACES.map(() => { const c = document.createElement('canvas'); c.width = c.height = 8; return c; });
      const mats = canvases.map(c => {
        const t = new THREE.CanvasTexture(c);
        t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
        t.colorSpace = THREE.SRGBColorSpace;
        return new THREE.MeshBasicMaterial({map: t, color: n.skin ? 0xffffff : colour});
      });
      if (n.skin) {
        const img = new Image();
        img.onload = () => {
          // Like the game: a hat area with no transparent pixel belongs to a legacy skin and is not drawn
          const probe = document.createElement('canvas'); probe.width = 32; probe.height = 16;
          const pg = probe.getContext('2d'); pg.drawImage(img, 32, 0, 32, 16, 0, 0, 32, 16);
          const px = pg.getImageData(0, 0, 32, 16).data;
          let hat = false; for (let i = 3; i < px.length; i += 4) if (px[i] < 128) { hat = true; break; }
          canvases.forEach((c, i) => {
            const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
            g.drawImage(img, FACES[i][0], FACES[i][1], 8, 8, 0, 0, 8, 8);
            if (hat) g.drawImage(img, FACES[i][0] + 32, FACES[i][1], 8, 8, 0, 0, 8, 8);
            mats[i].map.needsUpdate = true;
          });
        };
        img.src = 'data:image/png;base64,' + n.skin;
      }
      const cube = new THREE.Mesh(new THREE.BoxGeometry(edge, edge, edge), mats);
      group.add(cube);
      // The library turns whichever mesh the pointer hit when dragging with the right button. An invisible
      // twin takes the hits instead, so the visible head and its outline are never turned by the mouse.
      cube.raycast = () => {};
      const hit = new THREE.Mesh(new THREE.BoxGeometry(edge, edge, edge), new THREE.MeshBasicMaterial({visible: false}));
      group.add(hit);
      n._hit = hit;
      const frame = new THREE.Mesh(new THREE.BoxGeometry(edge * 1.12, edge * 1.12, edge * 1.12),
        new THREE.MeshBasicMaterial({color: colour, side: THREE.BackSide}));
      frame.raycast = () => {};
      group.add(frame);
      // The name hangs under the head on screen: the sprite sits at the head's centre and its anchor is moved
      // up by the head's half-diagonal, which works from any camera angle
      const label = textSprite(n.name, Math.max(7, edge * .75), 0xc9d1d9);
      label.center.set(.5, 1 + edge * 1.05 / label.scale.y);
      group.add(label);
      n._label = label;
      n._frame = frame;
      n._edge = size;
      n._cube = cube;
      return group;
    }

        // Reasons for one pair are merged: pct = 1 - product of (1 - p), so each extra shared sign raises it

            (fp ? '<div class="row"><span class="bits">' + esc(fp.bits) + '</span><span>' + t('{0} packs', fp.packs) + '</span></div>' : '<div style="color:var(--text2)">' + t('not tracked') + '</div>') +

          '<span class="legend" title="' + esc(t('Thicker line = higher match. Hover a head or a line for details.')) + '">' +
          '<span class="sq" style="border-color:#4493f8"></span>' + t('account') + '<span class="sq" style="border-color:#f85149"></span>' + t('mods detected') +
          '<i style="border-color:#8b949e"></i>' + t('same address') + '<i style="border-color:#3fb950"></i>' + t('same fingerprint') +
          '<i style="border-color:#a371f7"></i>' + t('same client') + '</span>' +
          // CC BY 4.0 asks for the source of the country data wherever it is shown
          (data.edges.some(e => e.org !== undefined) ? '<span style="font-size:10px;opacity:.7">' + t('IP data') + ': <a href="https://iptoasn.com/" target="_blank" rel="noopener" style="color:inherit">IPtoASN</a>, <a href="https://www.nro.net/" target="_blank" rel="noopener" style="color:inherit">NRO</a> (CC BY 4.0) ' + t('via') + ' <a href="https://github.com/sapics/ip-location-db" target="_blank" rel="noopener" style="color:inherit">ip-location-db</a></span>' : '');
        box.appendChild(info); box.appendChild(card); box.appendChild(dbgBox);
        const place = () => {
          if (!box.isConnected || !graph3d) { stopGraph(); return; } // another tab replaced the graph
          const now = performance.now(), dt = Math.min(.1, (now - (place.last || now)) / 1000);
          place.last = now;
          links.forEach(l => { if (l._label) l._label.visible = !!hover && (l.source.id === hover || l.target.id === hover); });
          nodes.forEach(n => {
            if (n.x === undefined) return;
            const hit = hl && matches(n);
            if (n._label) {
              n._label.material.color.set(hit ? 0xd29922 : 0xc9d1d9);
              n._label.material.opacity = hl && !hit ? .3 : 1;
            }
            const obj = n.__threeObj;

            if (obj) { const k = obj.scale.x + (want - obj.scale.x) * .15; obj.scale.setScalar(k); }
            if (n._hit) n._hit.quaternion.set(0, 0, 0, 1);

          graphRaf = requestAnimationFrame(place);
        };
        place();
        fit(0, 'initial');
      };
      ['g-ip', 'g-rp', 'g-cl', 'g-days', 'g-2d'].forEach(id => { document.getElementById(id).onchange = build; });
      const minInput = document.getElementById('g-min');
      minInput.oninput = () => { document.getElementById('g-min-v').textContent = minInput.value + '%'; };
      minInput.onchange = build;
      document.getElementById('g-dbg').onchange = e => { dbgBox.style.display = e.target.checked ? '' : 'none'; if (e.target.checked) dbg('debug on'); };
      // Matching heads grow more the rarer the match: 1 + 0.35 * log2(all / matching), at most 2.2x.
      // One match among 36 gets the full 2.2x, half of the graph matching gets 1.35x, everyone matching stays 1x.
      document.getElementById('g-search').oninput = e => {
        hl = e.target.value.trim().toLowerCase();
        const all = graph3d ? graph3d.graphData().nodes : [];
        const matching = hl ? all.filter(matches).length : 0;
        searchScale = matching ? Math.min(2.2, 1 + .35 * Math.log2(all.length / matching)) : 1;
        dbg('search "' + hl + '": ' + matching + ' of ' + all.length + ' match, heads x' + searchScale.toFixed(2));
      };
      build();
    }

    async function showHome() {
      const main = document.getElementById('main-content');
      main.innerHTML = '<div class="loading">' + t('Loading...') + '</div>';
      try {
        const [st, recent] = await Promise.all([apiFetch('stats'), apiFetch('scans?limit=15')]);
        const card = (num, label, route, colour) =>
          '<div class="stat-card' + (route ? ' link" onclick="nav(\'' + route + '\')' : '') + '"><div class="stat-card-num"' +
          (colour ? ' style="color:' + colour + '"' : '') + '>' + Number(num || 0).toLocaleString() + '</div><div class="stat-card-label">' + t(label) + '</div></div>';
        main.innerHTML =
          '<div class="section-title">' + t('Overview') + '</div>' +
          '<div class="stat-row wide">' +
            card(st.online, 'Online now') +
            card(st.accounts, 'Known accounts') +
            card(st.hack_scans, 'Hack Scans', 'history') +
            card(st.lang_scans, 'Lang Checks', 'history') +
            card(st.scans_today, 'Scans in 24 h', 'history') +
            card(st.detected_players, 'Players with mods', 'mods', 'var(--red)') +
          '</div>' +
          '<div class="section-title">' + t('Recent Activity') + '</div>' +
          '<div class="scan-cards">' + (recent.map(buildScanCard).join('') || '<div class="empty-state"><p>' + t('No scans yet.') + '</p></div>') + '</div>' +
          (recent.length >= 15 ? '<button class="more-btn" onclick="nav(\'history\')">' + t('Full history') + '</button>' : '');
      } catch(e) {
        main.innerHTML = '<div class="empty-state"><p>' + t('Error: {0}', esc(e.message)) + '</p></div>';
      }
    }

    // Scan history with filters; the filters survive leaving the page and coming back
    const historyFilter = {type: '', detected: false};
    const HISTORY_PAGE = 30;
    async function showHistory() {
      const main = document.getElementById('main-content');
      main.innerHTML =
        '<div class="section-title">' + t('Scan history') + '</div>' +
        '<div class="graph-bar">' +
          '<label>' + t('Type') + ' <select id="h-type">' + [['', 'all'], ['hack', 'Hack Check'], ['lang', 'Lang Check']]
            .map(([v, n]) => '<option value="' + v + '"' + (historyFilter.type === v ? ' selected' : '') + '>' + t(n) + '</option>').join('') + '</select></label>' +
          '<label><input type="checkbox" id="h-det"' + (historyFilter.detected ? ' checked' : '') + '> ' + t('only with mods found') + '</label>' +
        '</div>' +
        '<div class="scan-cards" id="h-list"><div class="loading">' + t('Loading...') + '</div></div>' +
        '<button class="more-btn" id="h-more" style="display:none">' + t('Load more') + '</button>';
      const list = document.getElementById('h-list'), more = document.getElementById('h-more');
      let offset = 0;
      const load = async reset => {
        if (reset) { offset = 0; list.innerHTML = '<div class="loading">' + t('Loading...') + '</div>'; }
        more.disabled = true;
        let page;
        try {
          page = await apiFetch('scans?limit=' + HISTORY_PAGE + '&offset=' + offset +
            (historyFilter.type ? '&type=' + historyFilter.type : '') + (historyFilter.detected ? '&detected=1' : ''));
        } catch(e) { list.innerHTML = '<div class="error-msg">' + esc(e.message) + '</div>'; return; }
        if (!list.isConnected) return;
        if (reset) list.innerHTML = '';
        offset += page.length;
        list.insertAdjacentHTML('beforeend', page.map(buildScanCard).join(''));
        if (!offset) list.innerHTML = '<div class="empty-state"><p>' + t('No scans yet.') + '</p></div>';
        more.style.display = page.length === HISTORY_PAGE ? '' : 'none';
        more.disabled = false;
      };
      document.getElementById('h-type').onchange = e => { historyFilter.type = e.target.value; load(true); };
      document.getElementById('h-det').onchange = e => { historyFilter.detected = e.target.checked; load(true); };
      more.onclick = () => load(false);
      load(true);
    }

    function buildScanCard(s) {
      const results = s.results || [];
      let preview = '';
      if (s.type === 'hack') {
        // Found mods first: they are what the card is for
        const shown = results.filter(r => r.result === 'DETECTED').concat(results.filter(r => r.result !== 'DETECTED'));
        preview = shown.slice(0, 6).map(r => r.result === 'DETECTED'
          ? '<span class="badge badge-DETECTED">' + esc(r.hack_name) + '</span>' : badge(r.result)).join(' ') +
          (results.length > 6 ? ' <span class="muted" style="font-size:11px">+' + (results.length - 6) + '</span>' : '');
      } else {
        const r = results[0];
        preview = r ? '<span class="badge badge-lang">' + esc(r.language || t('Unknown')) + '</span>' : '';
      }
      return '<div class="scan-card' + (s.has_detected == 1 ? ' hit' : '') + '" onclick="nav(\'scan/' + Number(s.id) + '\')">' +
        '<div class="scan-card-header">' +
          '<span class="scan-card-type">' + t(s.type === 'hack' ? 'Hack Check' : 'Lang Check') + ' — ' + esc(s.target_name) + '</span>' +
          '<span class="scan-card-time">' + timeAgo(s.timestamp) + '</span>' +
        '</div>' +
        '<div class="scan-card-meta">' + t('by {0}', esc(s.checker_name)) + ' &nbsp;·&nbsp; ' + new Date(Number(s.timestamp)).toLocaleString() + '</div>' +
        (preview ? '<div style="padding:8px 14px;display:flex;flex-wrap:wrap;gap:4px">' + preview + '</div>' : '') +
      '</div>';
    }

    async function showScan(id) {
      const main = document.getElementById('main-content');
      main.innerHTML = '<div class="loading">' + t('Loading scan #{0}...', id) + '</div>';
      try {
        const scan = await apiFetch('scan/' + id);
        const results = scan.results || [];

        let body = '';
        if (scan.type === 'hack') {
          if (results.length === 0) {
            body = '<div class="empty-state"><p>' + t('No results saved for this scan.') + '</p></div>';
          } else {
            const order = {DETECTED: 0, PROTECTED: 1, TIMEOUT: 2, NOT_DETECTED: 3, SKIPPED: 4};
            const sorted = results.slice().sort((a, b) => (order[a.result] ?? 5) - (order[b.result] ?? 5));
            const counts = {};
            results.forEach(r => { counts[r.result] = (counts[r.result] || 0) + 1; });
            let rows = '';
            for (const r of sorted) {
              rows += '<tr><td>' + esc(r.hack_name) + '</td><td>' + badge(r.result) + '</td></tr>';
            }
            body = '<div style="padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--border)">' +
              Object.keys(order).filter(k => counts[k]).map(k => badge(k).replace('</span>', ' × ' + counts[k] + '</span>')).join('') + '</div>' +
              '<table class="results-table"><thead><tr><th>' + t('Mod') + '</th><th>' + t('Result') + '</th></tr></thead><tbody>' + rows + '</tbody></table>';
          }
        } else {
          const r = results[0];
          if (r) {
            body = '<table class="results-table"><thead><tr><th>' + t('Language') + '</th><th>' + t('Raw Response') + '</th></tr></thead><tbody>' +
              '<tr><td><span class="badge badge-lang">' + esc(r.language || t('Unknown')) + '</span></td><td style="overflow-wrap:anywhere">' + esc(r.response || '') + '</td></tr>' +
              '</tbody></table>';
          } else {
            body = '<div class="empty-state"><p>' + t('No results saved for this scan.') + '</p></div>';
          }
        }

        const backTarget = scan.target_name;
        main.innerHTML =
          '<div class="toolbar"><button class="back-btn" data-player="' + esc(backTarget) + '">← ' + esc(backTarget) + '</button>' +
          '<button class="danger-btn" id="scan-delete" style="margin-bottom:14px">' + t('Delete scan') + '</button></div>' +
          '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">' +
            '<div style="padding:14px 16px;border-bottom:1px solid var(--border)">' +
              '<div style="font-size:16px;font-weight:700;margin-bottom:4px">' +
                t(scan.type === 'hack' ? 'Hack Check' : 'Lang Check') + ' #' + Number(scan.id) + ' — ' + esc(scan.target_name) +
              '</div>' +
              '<div style="font-size:12px;color:var(--text2)">' + t('by {0}', esc(scan.checker_name)) + ' · ' + new Date(Number(scan.timestamp)).toLocaleString() + '</div>' +
              (scan.reason ? '<div style="font-size:12px;color:var(--text2);margin-top:2px">' + t('Reason: {0}', esc(scan.reason)) + '</div>' : '') +
            '</div>' +
            body +
          '</div>';
        document.getElementById('scan-delete').onclick = async () => {
          if (!confirm(t('Delete scan #{0}? This cannot be undone.', id))) return;
          try {
            await apiFetch('scan/' + id, {method: 'DELETE'});
            showToast(t('Scan #{0} deleted', id));
            loadRecentScans();
            // Replace the history entry: going back to a deleted scan would only show an error
            location.replace('#' + playerRoute(backTarget));
          } catch(e) { showToast(t('Error: {0}', e.message)); }
        };
      } catch(e) {
        main.innerHTML = '<div class="empty-state"><p>' + t('Failed to load scan #{0}', id) + '</p><p class="error-msg">' + esc(e.message) + '</p></div>';
      }
    }

    function kv(label, value) {
      return '<div class="kv"><span>' + label + '</span><span>' + value + '</span></div>';
    }
    function dateTime(ts) {
      return ts ? esc(new Date(Number(ts)).toLocaleString()) + ' <small>' + esc(timeAgo(ts)) + '</small>' : '<span class="muted">—</span>';
    }
    const LINK_TYPES = {ip: 'same address', rptrack: 'same fingerprint', client: 'same client'};

    function clientCard(c, online) {
      if (!c || (!c.brand && !(c.channels || []).length)) {
        return '<div class="info-card"><h4>' + t('Client') + '</h4><div class="muted">' + t(online ? 'nothing received yet' : 'not recorded') + '</div></div>';
      }
      const ch = c.channels || [];
      let version = '';
      if (c.version_real) {
        version = kv(t('Real version'), esc(c.version_real)) + kv(t('Connected as'), esc(c.version_claimed || '?')) +
          (c.version_mismatch ? '<div class="warn" style="padding-top:4px">⚠ ' + t('the client hides its real version') + '</div>' : '');
      }
      return '<div class="info-card"><h4>' + t('Client') + (c.live ? '' : ' · ' + t('at last quit')) + '</h4>' +
        kv(t('Brand'), c.brand ? '<code>' + esc(c.brand) + '</code>' : '<span class="muted">—</span>') +
        (c.type ? kv(t('Loader'), esc(c.type.toLowerCase())) : '') +
        (c.updated ? kv(t('Recorded'), dateTime(c.updated)) : '') +
        version +
        '<div style="padding-top:6px" class="muted">' + t('{0} channels', ch.length) + '</div>' +
        (ch.length ? '<div class="chips">' + ch.map(x => '<span class="chip">' + esc(x) + '</span>').join('') + '</div>' : '') +
        '</div>';
    }

    async function showPlayer(name, quiet) {
      addHistory(name);
      const main = document.getElementById('main-content');
      if (!quiet) main.innerHTML = '<div class="loading">' + t('Loading {0}...', esc(name)) + '</div>';
      try {
        const data = await apiFetch('player/' + encodeURIComponent(name));
        if (location.hash !== '#' + playerRoute(name)) return; // the user went elsewhere meanwhile
        const scans = data.scans || [];
        const uuid = data.uuid || name;

        const onlineBadge = data.online
          ? '<span class="online-badge"><span style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block"></span> ' + t('Online') + '</span>'
          : '<span class="offline-badge">' + t(data.known ? 'Offline' : 'Never seen on this server') + '</span>';

        let runButtons = '';
        if (data.online) {
          runButtons =
            '<button class="run-btn" id="btn-hack" data-player="' + esc(name) + '" data-scan="hack">' + t('Run Hack Check') + '</button>' +
            '<button class="run-btn" id="btn-lang" data-player="' + esc(name) + '" data-scan="lang">' + t('Run Lang Check') + '</button>';
        }
        if (data.alts && data.alts.length)
          runButtons += '<button class="run-btn links-btn" onclick="nav(\'links/' + encodeURIComponent(data.uuid) + '\')">⚯ ' + t('Show in graph') + '</button>';

        const fp = data.fingerprint;
        const mods = (data.mods || []).slice();
        if (fp && fp.liquidbounce && !mods.some(m => m.name.toLowerCase() === 'liquidbounce'))
          mods.push({name: 'LiquidBounce', last_seen: fp.last_seen, via: t('resource-pack fingerprint')});

        let cards = '';
        if (data.known) {
          cards += '<div class="info-card"><h4>' + t('Account') + '</h4>' +
            kv(t('First seen'), dateTime(data.first_seen)) + kv(t('Last seen'), data.online ? '<span style="color:var(--green)">' + t('now') + '</span>' : dateTime(data.last_seen)) +
            (data.joins ? kv(t('Joins'), Number(data.joins).toLocaleString()) : '') +
            kv(t('Mods'), mods.length
              ? mods.map(m => '<span class="badge badge-DETECTED" style="margin:1px" title="' + esc(t('Last detected: {0}', new Date(Number(m.last_seen)).toLocaleString()) + (m.via ? ' (' + m.via + ')' : '')) + '">' + esc(m.name) + '</span>').join('')
              : '<span class="muted">' + t('no mods detected') + '</span>') +
            kv(t('Fingerprint'), fp ? '<span class="bits" style="font-family:monospace">' + esc(fp.bits) + '</span> <small>' + t('{0} packs', fp.packs) + '</small>' : '<span class="muted">' + t('not tracked') + '</span>') +
            '</div>';
          cards += clientCard(data.client, data.online);
          if (data.ips) {
            cards += '<div class="info-card"><h4>' + t('Addresses') + '</h4>' +
              (data.ips.length ? data.ips.map(r => kv(esc(r.ip) + (r.org !== undefined ? '<small>' + esc(provider(r)) + (r.weak ? ' · <span class="warn">' + t('VPN / hosting') + '</span>' : '') + '</small>' : ''),
                r.count + '× · ' + esc(timeAgo(r.last_seen)))).join('') : '<div class="muted">' + t('none recorded') + '</div>') +
              '</div>';
          }
          if (data.alts) {
            cards += '<div class="info-card"><h4>' + t('Possible alts') + '</h4>' +
              (data.alts.length ? data.alts.map(a => '<div class="kv alt" data-player="' + esc(a.name) + '"><span>' + esc(a.name) +
                '<small>' + a.types.map(x => t(LINK_TYPES[x] || x)).join(', ') + '</small></span><span>' + Math.round(a.pct * 100) + '%</span></div>').join('')
                : '<div class="muted">' + t('none') + '</div>') +
              '</div>';
          }
        }

        let scanCards = '';
        for (const s of scans) scanCards += buildScanCard(s);

        main.innerHTML =
          '<button class="back-btn" onclick="history.length > 1 ? history.back() : nav(\'home\')">← ' + t('Back') + '</button>' +
          '<div class="player-header">' +
            '<img src="' + headUrl(uuid) + '" data-fb="' + esc(headUrl(name)) + '" onerror="this.onerror=null;this.src=this.dataset.fb" width="64" height="64" alt="">' +
            '<div class="player-header-info"><h2>' + esc(name) + '</h2><p>' + esc(data.uuid || '') + '</p>' + onlineBadge + '</div>' +
          '</div>' +
          (runButtons ? '<div class="toolbar">' + runButtons + '</div>' : '') +
          (cards ? '<div class="info-grid">' + cards + '</div>' : '') +
          '<div class="section-title">' + t(scans.length === 1 ? '{0} Scan' : '{0} Scans', scans.length) + '</div>' +
          '<div class="scan-cards">' + (scanCards || '<div class="empty-state"><p>' + t('No scans for this player yet.') + '</p></div>') + '</div>';
        return scans.length ? Number(scans[0].id) : 0;
      } catch(e) {
        if (!quiet) main.innerHTML = '<div class="empty-state"><p>' + t('Failed to load player.') + '</p><p class="error-msg">' + esc(e.message) + '</p></div>';
      }
    }

    async function runScan(name, type) {
      const btn = document.getElementById(type === 'hack' ? 'btn-hack' : 'btn-lang');
      if (btn) btn.disabled = true;
      // Newest scan of the player now shown (scans come newest first)
      const top = document.querySelector('.scan-card[onclick]');
      const before = top ? +(top.getAttribute('onclick').match(/\d+/) || [0])[0] : 0;
      try {
        await apiPost('scan/run', { player: name, type: type });
        showToast(t(type === 'hack' ? 'Hack check started on {0}' : 'Lang check started on {0}', name));
      } catch(e) {
        showToast(t('Failed to run scan: {0}', t(e.message)));
        if (btn) btn.disabled = false;
        return;
      }
      // A scan takes a few seconds (longer with a slow client): reload the page until the new one is saved
      const route = playerRoute(name), started = Date.now();
      const poll = async () => {
        if (location.hash !== '#' + route) return;
        const newest = await showPlayer(name, true);
        if (newest > before) { loadRecentScans(); return; }
        if (Date.now() - started < 60000) {
          const b = document.getElementById(type === 'hack' ? 'btn-hack' : 'btn-lang');
          if (b) { b.disabled = true; b.textContent = t('Running...'); }
          setTimeout(poll, 2500);
        }
      };
      setTimeout(poll, 2500);
    }

    async function loadRecentScans() {
      try {
        const scans = await apiFetch('scans?limit=30');
        const container = document.getElementById('recent-scans');
        if (!container) return;
        if (!scans || scans.length === 0) {
          container.innerHTML = '<div style="padding:10px;color:var(--text2);font-size:12px;text-align:center">' + t('No scans yet') + '</div>';
          return;
        }
        container.innerHTML = '';
        for (const s of scans) {
          const el = document.createElement('div');
          el.className = 'scan-item' + (s.has_detected == 1 ? ' hit' : '');
          el.onclick = () => nav('scan/' + s.id);
          el.innerHTML =
            '<div class="scan-item-top">' +
              '<span class="scan-item-name">' + esc(s.target_name) + '</span>' +
              '<span class="scan-item-time">' + timeAgo(s.timestamp) + '</span>' +
            '</div>' +
            '<div class="scan-item-meta">' + t(s.type === 'hack' ? 'Hack' : 'Lang') + ' · ' + t('by {0}', esc(s.checker_name)) + '</div>';
          container.appendChild(el);
        }
      } catch(e) {}
    }

    async function loadOnlinePlayers() {
      try {
        const players = await apiFetch('players/online');
        const container = document.getElementById('online-players');
        if (!container) return;
        if (!players || players.length === 0) {
          container.innerHTML = '<div style="padding:10px;color:var(--text2);font-size:12px;text-align:center">' + t('No players online') + '</div>';
          return;
        }
        container.innerHTML = '';
        for (const p of players) {
          const el = document.createElement('div');
          el.className = 'player-item';
          el.onclick = () => nav(playerRoute(p.name));
          el.innerHTML =
            '<img src="' + headUrl(p.uuid) + '" data-fb="' + esc(headUrl(p.name)) + '" onerror="this.onerror=null;this.src=this.dataset.fb" alt="" width="28" height="28">' +
            '<span class="player-item-name">' + esc(p.name) + '</span>' +
            '<div class="online-dot"></div>';
          container.appendChild(el);
        }
      } catch(e) {}
    }

    function addHistory(name) {
      offlineHistory = [name, ...offlineHistory.filter(n => n !== name)].slice(0, 20);
      try { localStorage.setItem('ch_history', JSON.stringify(offlineHistory)); } catch(e) {}
      renderOfflineHistory();
    }

    function renderOfflineHistory() {
      const container = document.getElementById('offline-history');
      if (!container) return;
      if (offlineHistory.length === 0) {
        container.innerHTML = '<div style="padding:10px;color:var(--text2);font-size:12px;text-align:center">' + t('Search a player above') + '</div>';
        return;
      }
      container.innerHTML = '';
      for (const name of offlineHistory) {
        const el = document.createElement('div');
        el.className = 'player-item';
        el.onclick = () => nav(playerRoute(name));
        el.innerHTML =
          '<img src="' + headUrl(name) + '" onerror="this.style.visibility=\'hidden\'" alt="" width="28" height="28">' +
          '<span class="player-item-name">' + esc(name) + '</span>';
        container.appendChild(el);
      }
    }

    function searchPlayer() {
      const name = document.getElementById('search-input').value.trim();
      if (!name) return;
      document.getElementById('search-input').value = '';
      nav(playerRoute(name));
    }

    // Names are never spliced into inline onclick code: offline-mode servers accept names with quotes in them,
    // and the browser decodes &#39; back to ' before running an inline handler
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-player]');
      if (!el) return;
      if (el.dataset.scan) runScan(el.dataset.player, el.dataset.scan);
      else nav(playerRoute(el.dataset.player));
    });

    init();
</script>
</body>
