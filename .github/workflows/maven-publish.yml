name: Maven Package

on:
  push:
  release:
    types: [published]

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}
          cache: maven

      - name: Show Java version
        run: mvn -version

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Publish to GitHub Packages
        run: mvn -B deploy -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          
  notify-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Send release announcement to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          AUTHOR: ${{ github.event.release.author.login }}
          BODY: ${{ github.event.release.body }}
        run: |
          NOTES="${BODY:-No release notes provided.}"
          if [ ${#NOTES} -gt 1000 ]; then
            NOTES="${NOTES:0:997}..."
          fi
          TITLE="${RELEASE_NAME:-$TAG}"

          jq -n \
            --arg repo "$REPO" \
            --arg tag "$TAG" \
            --arg title "$TITLE" \
            --arg url "$RELEASE_URL" \
            --arg author "$AUTHOR" \
            --arg notes "$NOTES" \
            '{
              username: "CheckHacks CI",
              flags: 32768,
              components: [
                {
                  type: 17,
                  accent_color: 3066993,
                  components: [
                    { type: 10, content: "## 🚀 New Release" },
                    { type: 10, content: "A new release has been published on **\($repo)**." },
                    { type: 14, divider: true, spacing: 1 },
                    { type: 10, content: "🏷️ **Version**\n`\($tag)`" },
                    { type: 10, content: "📛 **Release**\n`\($title)`" },
                    { type: 10, content: "👤 **Author**\n`\($author)`" },
                    { type: 14, divider: true, spacing: 1 },
                    { type: 10, content: "📝 **Release Notes**\n\($notes)" },
                    { type: 14, divider: true, spacing: 1 },
                    { type: 10, content: "🔗 **[Download the release](\($url))**" }
                  ]
                }
              ]
            }' | curl -X POST "${DISCORD_WEBHOOK}?with_components=true" \
              -H "Content-Type: application/json" \
              -d @-