name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Builds the release of a tag pushed before this workflow existed (or whose run failed)
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release, e.g. v0.9.5
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tag matches pom.xml version
        if: env.TAG != ''
        run: |
          version=$(mvn -q -N -DforceStdout help:evaluate -Dexpression=project.version)
          [ "v$version" = "$TAG" ] || { echo "Tag $TAG but pom.xml says $version"; exit 1; }
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: veneer
          path: veneer-plugin/target/veneer-*.jar
      - name: Publish release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: veneer-plugin/target/veneer-*.jar
          generate_release_notes: true
