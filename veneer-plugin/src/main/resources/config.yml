    # Auto-check on join
    auto-check-on-join:
      enabled: false
      only-first-join: false
      hacks:
        - meteor-client
        - freecam
        - bleachhack
        - world-downloader
        - autoclicker-fabric
        - antiafk

    # Auto-check when an anticheat flags a player
    detect-flag:
      enabled: false
      anticheats:
        grim: true
        vulcan: true
        spartan: true
        matrix: true
        intave: true
        aac: true
      cooldown-hours: 24
      hacks:
        - meteor-client
        - freecam
        - bleachhack
        - world-downloader
        - autoclicker-fabric
        - antiafk
        - baritone

    # Auto-check when spoof detection flags a player. Uses the hack list and cooldown of detect-flag.
    # Needs the spoof module; Bedrock players are skipped.
    detect-spoof-flag:
      enabled: true

    # ──────────────────────────────────────────────
    # ACTIONS
    # Placeholders: %player%, %hack% / &hack& / {hack} / {player}
    # %hack% expands to comma-separated list for global commands, single name for per-hack rules
    # ──────────────────────────────────────────────
    command-if-positive:
      enabled: false
      command: "tempban %player% 14d Cheating"

    command-if-protected:
      enabled: false
      command: "tempban %player% 14d Cheating"

    command-if-clean:
      enabled: false
      command: "give %player% diamond 1"

    # Per-mod rules: executed when a specific mod returns a specific result
    command-rules:
      meteorclient1:
        mod: meteorclient
        result: DETECTED
        command: "tempban %player% 31d Meteor Client"

    # ──────────────────────────────────────────────
    # PERFORMANCE / RELIABILITY
    # ──────────────────────────────────────────────
    # Re-check DETECTED/PROTECTED/TIMEOUT results with a second confirmation scan to reduce false positives
    doublecheck: true
    # Leave the mods that were not found out of the check result (chat and Discord). The history keeps them.
    hide-clean: true
    # Add the plugin channels the client registered to the check result
    show-channels: true
    # How long to wait for client response per sign (ticks, 20 = 1s)
    # With adaptive-timeout on this is the upper limit.
    timeout-ticks: 200
    # Wait for the answer as long as the player's ping needs plus a margin, instead of always timeout-ticks.
    # A silent client is marked TIMEOUT sooner; a laggy one gets more time. Bedrock players are never scanned.
    adaptive-timeout: true
    # Added to the ping, in ticks (20 = 1s). Covers the 1 tick delay before the sign closes and ping jitter.
    adaptive-margin-ticks: 4
    # Lower limit of the adaptive wait (ticks)
    adaptive-min-ticks: 20
    # When a sign gets no answer, send it once more with twice the wait before marking it TIMEOUT
    retry-on-timeout: true
    # Delay between signs when checking multiple hacks (ticks)
    between-sign-ticks: 5
    # Oldest client version (the protocol the server sees, through Via too) that is scanned by mod and language
    # checks. Tested: 1.17 and newer answer; with 1.16.5 and older the probe sign never shows up (ViaBackwards
    # cannot send blocks below y=0 to them), the check times out, and on 1.12.2 the sign window stays open.
    # Needs the spoof module (PacketEvents) to know the version; without it every client is scanned.
    min-client-version: "1.17"

  language-check:
    auto-check-on-join:
      enabled: false
      only-first-join: false

    # Real client version: the other three lines of the language sign show which game version the client really
    # is (key bindings, keys Mojang removed, and for en_us clients keys added in each version), and that is
    # compared with the protocol version it connects with. A client posing as another version, as ViaFabricPlus
    # or ViaProxy do, raises a "version-mismatch" alert. In any language it tells apart every release from 1.21.5
    # on (not 1.21.6-1.21.8 or 1.21.9/1.21.10 from each other) and a few below; en_us clients show nearly every
    # release. Needs PacketEvents (the answers are read from the packet, Paper cuts sign lines to 80 characters).
    version-check:
      enabled: true
      # Console command on a mismatch. Placeholders: %player%, %real% (e.g. "<=1.21.1"), %claimed% (e.g. "1.21.11")
      command-if-mismatch: ""

    # title and message placeholders: %player%, %uuid%, %checker%, %lang% (detected language), %response% (the raw
    # answer), %brand%, %version%, plus any PlaceholderAPI placeholder
    discord:
      enabled: false
      webhook-url: ""   # empty = general.discord.webhook
      title: "Veneer language check"
      embed-color: "#57F287"
      use-components-v2: true
      message: "**Player:** %player%\n**Checked by:** %checker%\n**Language:** %lang%"

    timeout-ticks: 100

    # What the client shows for the key.forward translation, per language (from the game's own language files,
