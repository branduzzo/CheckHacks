# ══════════════════════════════════════════════════════════════
#  Veneer - config.yml (the only configuration file)
#
#  general:   settings shared by every module (language, prefix, debug, alerts, Bedrock, Discord, updates)
#  spoof:     client brand / channel spoof detection (from AntiSpoof)
#  hacks:     mod detection through sign translation (from CheckHacks)
#  rptrack:   resource-pack cache fingerprint (off by default)
#
#  Missing settings are added from the defaults when the plugin starts or reloads.
#  Chat messages of the mod scan live in messages/<language>.yml.
#  Reload with /veneer reload. Turning a module on or off needs a restart.
# ══════════════════════════════════════════════════════════════

general:
  # Language file for the mod scan messages: messages/<language>.yml
  # (en, it, de, es, fr, br, ru, lolcat, uwu)
  language: "en"

  # Prefix of mod scan messages (MiniMessage). Also used as {prefix} in messages/*.yml
  prefix: "<gradient:#FFBA00:#03E700>[Veneer]</gradient> <gray>"

  # Log extra details to the console (client brands, channels, webhook sends, Bedrock detection).
  debug: false

  # Staff alerts (spoof flags, mod scan results, RPTrack matches) go to players with the
  # veneer.alerts permission. Everyone can switch their own with /veneer alerts.
  alerts:
    # true = alerts are on until a player switches them off
    default-enabled: true

  # How Bedrock players are recognised, for every module. Floodgate and Geyser are used automatically
  # when installed; the name prefix is the fallback (for Floodgate on a proxy), and it only counts with a
  # Floodgate-style uuid (00000000-0000-0000-...), so an offline-mode Java player cannot pass as Bedrock.
  bedrock:
    prefix-check: true
    prefixes:
      - "."
      - "*"

  # Discord webhook used by every module that has no URL of its own
  # (spoof.discord.webhook, hacks.discord.webhook-url, hacks.language-check.discord.webhook-url).
  discord:
    webhook: ""

  # Looks up the latest release on github.com/ReAndrew/veneer when the server starts.
  update-checker:
    enabled: true
    # Tell players with veneer.admin when a newer release exists
    notify-on-join: true

spoof:
  # Set to false to switch off client brand/channel detection (and PacketEvents) entirely.
  enabled: true

  # ──────────────────────────────────────────────────────────
  #                  Spoof detection
  # ──────────────────────────────────────────────────────────
  # Helps detect client-side modifications by analysing the brand and plugin channels
  # a client sends. It is not foolproof: skilled users can spoof both.
  #
  # By default only players claiming 'vanilla' while having registered plugin channels are flagged,
  # which is impossible on a true vanilla client.
  # ──────────────────────────────────────────────────────────

  # Delay (in seconds) before the first check after a player joins.
  # 0 checks immediately (unreliable, the brand may not have arrived). (Default: 1)
  delay-in-seconds: 1

  # ──────────────────────────────────────────────────────────
  #                  Core Detection Settings
  # ──────────────────────────────────────────────────────────

  # Vanilla Spoof Detection
  # Detects when a player claims to use vanilla but has registered plugin channels
  vanillaspoof-check:
    # Whether to check if a player claiming "vanilla" client has plugin channels
    enabled: true
    # Whether to send alerts to Discord for this violation type
    discord-alert: true
    # Custom alert messages for this specific violation
    alert-message: "&8[&cVeneer&8] &e%player% flagged! &cVanilla client with plugin channels"
    console-alert-message: "%player% flagged! Vanilla client with plugin channels"
    # Whether to punish the player if detection is positive
    punish: false
    # Punishment actions to execute
    # Available placeholders: %player%, %reason%, %brand%, %channel%
    punishments:
      - "kick %player% &cVanilla spoof detected: %reason%"
      # - "ban %player% &cVanilla client spoofing detected"

  # Super Strict Mode (Not Recommended)
  # Blocks players who either:
  #    - Do NOT have a "vanilla" client, OR
  #    - Have registered plugin channels (indicating mods/plugins)
  # ⚠️ This is an extremely strict mode and may block legitimate players
  non-vanilla-check:
    # Whether to enable this strict check
    enabled: false
    # Whether to send alerts to Discord for this violation type
    discord-alert: false
    # Custom alert messages for this specific violation
    alert-message: "&8[&cVeneer&8] &e%player% flagged! &cClient modifications detected"
    console-alert-message: "%player% flagged! Client modifications detected"
    # Whether to punish the player if detection is positive
    punish: false
    # Punishment actions to execute
    # Available placeholders: %player%, %reason%, %brand%, %channel%
    punishments:
      - "kick %player% &cNon-vanilla client with channels detected"
      # - "tempban %player% 1h &cUsing a modified client"

  # ──────────────────────────────────────────────────────────
  #               No Brand Detection Settings
  # ──────────────────────────────────────────────────────────
  # Some hacked clients avoid detection by not sending a client brand at all
  # This check flags players who connect without providing any brand information
  no-brand-check:
    # Whether to flag players who don't send a client brand
    enabled: true
    # Whether to send alerts to Discord for this violation type
    discord-alert: true
    # Custom alert messages for this specific violation
    alert-message: "&8[&cVeneer&8] &e%player% flagged! &cNo client brand detected"
    console-alert-message: "%player% flagged! No client brand detected"
    # Whether to punish the player if detection is positive
    punish: false
    # Punishment actions to execute
    # Available placeholders: %player%, %reason%
    punishments:
      - "kick %player% &cNo client brand detected"
      # - "ban %player% &cSuspicious client detected (no brand)"

  # ──────────────────────────────────────────────────────────
  #                 Channel Detection Settings
  # ──────────────────────────────────────────────────────────
  blocked-channels:
    # Enable channel-based detection
    enabled: false
    # Whether to send alerts to Discord for blocked channel violations
    discord-alert: false

    # ⚪ Whitelist Mode
    # - FALSE: Block listed channels.
    # - SIMPLE: Only allow players with at least one whitelisted channel.
    # - STRICT: Only allow players who match the exact whitelist and have no extra channels.
    whitelist-mode: FALSE

    # List of channels to block/whitelist
    values:
      - "^fabric-screen-handler-api-v1:open_screen$"
      # World Downloader (1.13+ and legacy channel names)
      - "^wdl:(init|control|request)$"
      - "(?i)^wdl\\|(init|control|request)$"
      # Add more channels to block here
      # - "another:blocked:channel"
      # - "(?i).*litematica.*"
      # - "(?i).*fabric.*"

    # Custom alert messages for this specific violation
    alert-message: "&8[&cVeneer&8] &e%player% flagged! &cUsing blocked channel: &f%channel%"
    console-alert-message: "%player% flagged! Using blocked channel: %channel%"
    # Messages used instead when whitelist-mode is SIMPLE or STRICT
    whitelist-alert-message: "&8[&cVeneer&8] &e%player% flagged! &cChannels don't match whitelist requirements"
    whitelist-console-alert-message: "%player% flagged! Channels don't match whitelist requirements"

    # Whether to punish the player if detection is positive
    punish: false
    # Punishment actions to execute
    # Available placeholders: %player%, %reason%, %brand%, %channel%
    punishments:
      - "kick %player% &cBlocked channel detected: %channel%"
      # - "tempban %player% 1d &cUsing blocked mod channels"

  # ──────────────────────────────────────────────────────────
  #                 Client Brands Configuration
  # ──────────────────────────────────────────────────────────
  # This section allows for granular control over different client types.
  # Each brand can have its own detection patterns, alert messages,
  # punishments, and special exemptions.
  client-brands:
    # Master switch for the client brands system
    enabled: true

    # Default settings for brands not explicitly configured
    default:
      flag: true
      alert: true
      discord-alert: false
      punish: false
      # Default alert message if not specified for a brand
      alert-message: "&8[&cVeneer&8] &7%player% using unknown client: &e%brand%"
      console-alert-message: "%player% using unknown client: %brand%"

    # Unknown brands come with [Allow] / [Block] buttons in the staff alert (also /spoof brands). The verdict
    # is kept in data.db for that exact brand string: allowed brands count as a known clean client, blocked
    # ones are flagged like a cheat client with the settings below.
    staff-verdicts:
      blocked:
        alert-message: "&8[&cVeneer&8] &7%player% is using blocked client &c%brand%"
        console-alert-message: "%player% is using blocked client: %brand%"
        discord-alert: true
        punish: false
        punishments:
          - "kick %player% &cThis client is not allowed on this server"

    # Brand-specific configurations
    brands:
      # Lunar Client Configuration
      lunar:
        enabled: true
        values:
          - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4}$"
        # Whether to count the player as flagged by spoof detection
        flag: false
        # Whether to send in-game alerts for this brand
        alert: true
        # Whether to send Discord alerts for this brand
        discord-alert: false
        # Custom alert messages for this brand
        alert-message: "&8[&eVeneer&8] &7%player% is using &9Lunar Client &7version: &b%brand%"
        console-alert-message: "%player% is using Lunar Client: %brand%"
        # Whether to punish players using this brand
        punish: false
        # Punishment commands if punish is true
        punishments: []
        # Channels that must be present for this brand to be legitimate
        required-channels:
          - "lunar.*"  # Must have at least one lunar channel
        # Punish players if they do not have the channel(s)? Set to false to simply alert.
        required-channels-punish: false
        required-channels-punishments:
          - "kick %player% &cLunar Client spoofing detected"

      # Badlion Client Configuration
      badlion:
        enabled: true
        values:
          - "^badlion.*"
          - "^BLC.*"
        flag: false
        alert: true
        discord-alert: false
        alert-message: "&8[&eVeneer&8] &7%player% is using &b%brand%"
        console-alert-message: "%player% is using Badlion Client: %brand%"
        punish: false
        punishments: []
        required-channels: []
        required-channels-punish: false
        required-channels-punishments:
          - "kick %player% &cLunar Client spoofing detected"

      # Forge Configuration
      forge:
        enabled: true
        values:
          - "^fml,forge.*"
          - "^forge.*"
        flag: false
        alert: true
        discord-alert: false
        alert-message: "&8[&eVeneer&8] &7%player% is using &b%brand%"
        console-alert-message: "%player% is using Forge: %brand%"
        punish: false
        punishments: []
        required-channels:
          - "(?i).*forge.*"
        required-channels-punish: false
        required-channels-punishments:
          - "kick %player% &cChannel spoofing detected"

      # Fabric Configuration
      fabric:
        enabled: true
        values:
          - "^fabric$"
        flag: false
        alert: true
        discord-alert: false
        alert-message: "&8[&eVeneer&8] &7%player% is using &b%brand%"
        console-alert-message: "%player% is using Fabric: %brand%"
        punish: false
        punishments: []
        required-channels:
          - "(?i).*fabric.*" # Matches any channel containing "fabric" (case insensitive)
        required-channels-punish: false
        required-channels-punishments:
          - "kick %player% &cChannel spoofing detected"

      # LabyMod Configuration
      labymod:
        enabled: true
        values:
          - "^labymod.*"
        flag: false
        alert: true
        discord-alert: false
        alert-message: "&8[&eVeneer&8] &7%player% is using &b%brand%"
        console-alert-message: "%player% is using %brand%"
        punish: false
        punishments: []
        required-channels: []
        required-channels-punish: false
        required-channels-punishments:
          - "kick %player% &cChannels spoofing detected"

      # Hacked Clients Configuration
      hacked:
        enabled: true
        values:
          - "(?i).*wurst.*"
          - "(?i).*impact.*"
          - "(?i).*aristois.*"
          - "(?i).*future.*"
          - "(?i).*meteor.*"
          - "(?i).*inertia.*"
          - "(?i).*sigma.*"
          - "(?i).*liquidbounce.*"
        flag: true
        alert: true
        discord-alert: true
        alert-message: "&8[&cVeneer&8] &e%player% is using &c&lknown hacked client: &f%brand%"
        console-alert-message: "ALERT! %player% is using known hacked client: %brand%"
        punish: true
        punishments:
          - "kick %player% &cHacked client detected: %brand%"
          # - "ban %player% &cUse of hacked client detected"

      # Vanilla Configuration
      vanilla:
        enabled: true
        values:
          - "^vanilla$"
        flag: false # Only flags if the player is caught spoofing
        alert: false  # Don't alert for vanilla clients by default
        discord-alert: false
        alert-message: "&8[&cVeneer&8] &7%player% is using &d%brand%"
        console-alert-message: "%player% is using %brand%"
        punish: false
        punishments: []
        # Special settings for vanilla
        # "strict-check" flags if the client has ANY plugin channels (Must be enabled to detect VanillaSpoof)
        # You can add this "strict-check" to any client brand and only then will it be processed by the earlier "vanillaspoof-check"
        strict-check: true  # Enable strict checking for vanilla (must have NO channels)

      vanilla-variation: # When a client shows "Vanilla" or "vAnilla2" but not "vanilla"
        enabled: true
        values:
          - "^(?!vanilla$).*?(?i)vanilla.*"
        flag: true
        alert: true
        discord-alert: true
        alert-message: "&8[&cVeneer&8] &e%player% using fake Vanilla: &c%brand%"
        console-alert-message: "%player% is using fake Vanilla: %brand%"
        punish: false
        punishments: []
        strict-check: true

      blankbrand: # When a client sends a blank brand channel
        enabled: true
        values:
          - "^$"   # regex for empty/blank brand
        flag: true
        alert: true
        discord-alert: true
        alert-message: "&8[&eVeneer&8] &7%player% &eis using a blank brand"
        console-alert-message: "%player% is using a blank brand"
        punish: false
        punishments: []

  # ──────────────────────────────────────────────────────────
  #                Bedrock Handling Settings
  # ──────────────────────────────────────────────────────────
  bedrock-handling:
    # Choose how to handle Bedrock players.
    # Options:
    #   - "IGNORE": Completely ignore these players; process them like regular players.
    #   - "EXEMPT": Process them but don't punish them for failing checks.
    #
    # Either way, Bedrock players won't get the anti-spoof treatment.
    # "EXEMPT" mode is highly recommended as "IGNORE" can easily falsely punish Bedrock players.
    mode: "EXEMPT"

    # Geyser Spoofing Detection
    # Detects players claiming a client brand including a variation of "geyser" without being verified
    # as Bedrock players by the Floodgate API.
    geyser-spoof:
      # Whether to enable geyser spoofing detection
      enabled: true
      # Whether to send alerts to Discord for Geyser spoofing violations
      discord-alert: true
      # Custom alert messages for this specific violation
      alert-message: "&8[&cVeneer&8] &e%player% flagged! &cGeyser client spoofing"
      console-alert-message: "%player% flagged! Geyser client spoofing with brand: %brand%"

      # Whether to punish the player if detection is positive
      punish: false
      # Punishment actions to execute
      # Available placeholders: %player%, %reason%, %brand%
      punishments:
        - "kick %player% &cGeyser client spoofing detected"
        # - "ban %player% &cGeyser client spoofing"


  # ──────────────────────────────────────────────────────────
  #                 Discord Webhook Settings
  # ──────────────────────────────────────────────────────────
  # embed-title and message placeholders: %player%, %uuid%, %reason%, %brand%, %version%, %violations% and
  # %channels% (one bullet per line), %alert% (the console line), plus any PlaceholderAPI placeholder
  discord:
    enabled: false
    # Leave empty to use general.discord.webhook
    webhook: ""
    embed-title: "Veneer spoof alert"
    embed-color: "#2AB7CA"
    # true = Discord Components V2 (Container + accent_color), false = classic embeds
    use-components-v2: false
    message: "**Player**: %player%\n**Violations**:\n%violations%\n**Client Version**: %version%\n**Brand**: `%brand%`\n**Channels**:\n%channels%"

  # Whether to send Discord alerts when a player joins with a client brand,
  # even without a violation
  global-alerts:
    join-brand-alerts: false

  # ──────────────────────────────────────────────────────────
  #                Fallback Punishment Settings
  # ──────────────────────────────────────────────────────────
  # Used when a check has 'punish: true' but no punishments of its own.
  # Available placeholders: %player%, %reason%, %brand%, %channel%
  punishments:
    - "kick %player% &cSuspicious client detected!"
    # - "ban %player% &cClient spoofing detected"

  # ──────────────────────────────────────────────────────────
  #                Fallback Alert Messages
  # ──────────────────────────────────────────────────────────
  # Used when a check has no alert message of its own.
  # Available placeholders: %player%, %reason%, %brand%, %channel%
  # Sent to players with the veneer.alerts permission when a spoofing attempt is detected.
  messages:
    # Message shown to staff
    alert: "&8[&cVeneer&8] &e%player% flagged! &c%reason%"
    # Message logged to console (no color codes needed)
    console-alert: "%player% flagged! %reason%"
    # Console and Discord line when a player has several violations
    console-multiple-flags: "%player% has multiple violations: %reasons%"

hacks:
  # Set to false to switch off mod scanning (/hackcheck, /hacklang, auto-checks and the web panel).
  enabled: true

  # Web panel (/hackeditor): scan history and manual scans, served by the plugin itself.
  web-editor:
    enabled: true
    # Host in the link that /hackeditor gives to the player
    host: "localhost"
    # Address the panel listens on. 127.0.0.1 only accepts connections from this machine
    # (use a reverse proxy or tunnel); 0.0.0.0 listens on every interface.
    bind: "127.0.0.1"
    port: 8080
    token-expire-minutes: 10
    # Account graph: addresses accounts join from are stored to link accounts that share one
    links:
      # Days to keep an address after the account last used it (0 = forever)
      retention-days: 90
      # An address shared by more accounts than this is ignored (shared networks, mobile data)
      max-accounts-per-ip: 8
      # Provider and country of each address, shown in the panel, from ip-location-db (IPtoASN, PDDL; NRO country
      # data, CC BY 4.0). About 50 MB is downloaded to plugins/Veneer/geo/ via cdn.jsdelivr.net.
      ip-database: true
      ip-database-refresh-days: 7
      # A shared address of a VPN, Cloudflare WARP or a hosting provider links strangers, so its link counts only
      # this much (0 to 1). Such a provider is one of these ASNs or has one of the keywords in its name.
      weak-provider-factor: 0.3
      weak-provider-asns: [13335, 209242, 9009, 60068, 212238, 16276, 24940, 14061, 16509, 14618, 15169, 396982,
                           8075, 63949, 20473, 51167, 60781, 28753, 39351, 136787, 44477, 49505, 9123, 210644]
      weak-provider-keywords: [vpn, proxy, hosting, datacenter, "data center", cloud, vps, dedicated, colocation]
      # Same client: accounts with the same brand and the same set of plugin channels (needs the spoof module).
      # Only sets with at least client-min-channels channels count, shared by no more than max-accounts-per-client
      # accounts: a common client (plain vanilla, a popular modpack) says nothing.
      client-min-channels: 3
      max-accounts-per-client: 5
    # Scan history (mod scans and language checks with their results)
    history:
      # Days to keep a scan (0 = forever)
      retention-days: 180

  # Discord webhook for mod scan results
  # title and message placeholders: %player%, %uuid%, %checker%, %reason%, %hacks% (mods checked),
  # %results% (one "mod: RESULT" per line), %detected% (mods found, or none), %brand%, %channels%, %version%,
  # plus any PlaceholderAPI placeholder (%luckperms_prefix%, %player_ping%...). The older &name& form still works.
  discord:
    enabled: false
    # Leave empty to use general.discord.webhook
    webhook-url: ""
    title: "Veneer mod scan"
    # "#RRGGBB" or a decimal number
    embed-color: "#FFFF00"
    # true = Discord Components V2 (Container + accent_color), false = classic embeds
    use-components-v2: true
    message: "**Player:** %player%\n**Checked by:** %checker%\n**Reason:** %reason%\n**Hacks checked:** %hacks%\n**Results:**\n%results%"

  detection:

    # ──────────────────────────────────────────────
    # HACK DEFINITIONS
    # Each entry needs:
    #   display-name: shown in alerts / web editor / discord
    #   key: translation or keybind key registered by the mod
    #   mode: METEOR | TRANSLATE | KEYBIND
    # ──────────────────────────────────────────────
    hacks:
      meteor-client:
        display-name: "Meteor Client"
        key: "key.meteor-client.open-gui"
        mode: METEOR

      liquidbounce:
        display-name: "LiquidBounce"
        key: "liquidbounce.module.killaura.name"
        mode: TRANSLATE

      freecam:
        display-name: "Freecam"
        key: "key.freecam.toggle"
