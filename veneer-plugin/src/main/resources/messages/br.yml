gui-channel-kicked: "{prefix}<green>{count} jogador(es) expulso(s) com os canais: <white>{channels}"
gui-channel-none-online: "{prefix}<gray>Nenhum jogador online tem os canais: <white>{channels}"
gui-channels-empty: "<gray>Nenhum grupo de canais registrado"
