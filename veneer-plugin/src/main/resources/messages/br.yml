# ======================================================================
# VENEER  /veneer info <player>
# Placeholders: {player}, {offline}, {brand}, {type}, {channels}, {flags}, {group}, {when}, {count}, {result}, {packs}, {linked}.
# The short 'words' (unknown, bedrock, none, clean) are put into the lines above.
# ======================================================================
veneer-info-usage: "{prefix}<red>Uso: /{label} info \\<player></red>"
veneer-info-title: "{prefix}<gold>Veneer</gold> <gray>relatório de</gray> <white>{player}</white>{offline}"
veneer-info-offline: " <gray>(offline)</gray>"
veneer-info-client: "{prefix}<gray>Cliente:</gray> <white>{brand}</white> <gray>({type}, {channels} canais)</gray>"
veneer-info-version: "{prefix}<gray>Versão:</gray> <white>{claimed}</white> <gray>(teste com placa: {real})</gray>"
veneer-info-version-mismatch: "{prefix}<gray>Versão:</gray> <white>{claimed}</white> <red>mas o teste com placa diz {real}</red>"
veneer-info-status: "{prefix}<gray>Status:</gray> <white>{flags}</white>"
veneer-info-group: "{prefix}<gray>Grupo:</gray> <white>{group}</white>"
veneer-info-bypass: "{prefix}<gray>Isenção {module}:</gray> <white>{when}</white> <gray>{source}</gray>"
veneer-info-bypass-always: "sim"
veneer-info-bypass-join: "só ao entrar"
veneer-info-bypass-later: "só depois de entrar"
veneer-info-bypass-node: "({node})"
veneer-info-bypass-node-group: "({node}, grupo {group})"
veneer-scan-never: "{prefix}<gray>Varredura de mods:</gray> <white>nunca verificado</white>"
veneer-scan-line: "{prefix}<gray>Varredura de mods:</gray> <white>{when}</white> <gray>-</gray> {result} <gray>({count} varreduras registradas)</gray>"
veneer-rp-none: "{prefix}<gray>RPTrack:</gray> <white>nenhuma impressão digital armazenada</white>"
veneer-rp-line: "{prefix}<gray>RPTrack:</gray> <white>{packs} packs em cache</white> <gray>- contas vinculadas:</gray> <white>{linked}</white>"
veneer-unknown: "desconhecido"
veneer-flag-bedrock: "bedrock"
veneer-flag-spoof: "<red>sinalizado pela detecção de spoof</red>"
veneer-scan-clean: "<green>limpo</green>"
veneer-scan-found: "<red>{found}</red>"
veneer-rp-linked-none: "nenhuma"

# ======================================================================
# RPTRACK  /rptrack and staff report
# Placeholders: {label}, {player}, {mask}, {packs}, {linked}, {text}. {text} of rptrack-report is one of the rptrack-text-* lines; {players} there lists the linked accounts.
# ======================================================================
rptrack-disabled: "{prefix}<red>O RPTrack está desativado (rptrack.enabled).</red>"
rptrack-usage: "{prefix}<red>Uso: /{label} \\<player></red>"
rptrack-none: "{prefix}<gray>Nenhuma impressão digital armazenada para</gray> <white>{player}</white><gray>.</gray>"
rptrack-cache: "{prefix}<white>{player}</white> <gray>cache:</gray> <white>{mask}</white> <gray>({packs} packs)</gray>"
rptrack-linked: "{prefix}<gray>Contas vinculadas:</gray> <white>{linked}</white>"
rptrack-report: "{prefix}<gray>[RPTrack]</gray> <white>{player}</white><gray>:</gray> {text}"
rptrack-text-liquidbounce: "servidor HTTP local do LiquidBounce (porta 15000) acessível"
rptrack-text-same-cache: "mesmo cache de cliente que: {players}"
rptrack-text-probably-same: "provavelmente o mesmo cliente (falta um pacote) que: {players}"

# ======================================================================
# STARTUP BANNER  (console, shown inside the frame)
# Plain text, no tags. {ms}, {modules}, {version} (running, then latest when known). The logo itself is in the plugin code.
# ======================================================================
banner-loaded: "Carregado em {ms} ms!"
banner-modules: "Módulos: {modules}"
banner-version: "Versão {version}"
banner-author: "Por: ReAndrew"
banner-no-modules: "nenhum"
