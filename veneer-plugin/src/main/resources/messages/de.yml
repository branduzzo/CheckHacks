rptrack-cache: "{prefix}<white>{player}</white> <gray>Cache:</gray> <white>{mask}</white> <gray>({packs} Packs)</gray>"
rptrack-linked: "{prefix}<gray>Verknüpfte Accounts:</gray> <white>{linked}</white>"
rptrack-report: "{prefix}<gray>[RPTrack]</gray> <white>{player}</white><gray>:</gray> {text}"
rptrack-text-liquidbounce: "lokaler HTTP-Server von LiquidBounce (Port 15000) erreichbar"
rptrack-text-same-cache: "gleicher Client-Cache wie: {players}"
