# ======================================================================
# VENEER  /veneer info <player>
# Placeholders: {player}, {offline}, {brand}, {type}, {channels}, {flags}, {group}, {when}, {count}, {result}, {packs}, {linked}.
# The short 'words' (unknown, bedrock, none, clean) are put into the lines above.
# ======================================================================
veneer-info-usage: "{prefix}<red>Verwendung: /{label} info \\<player></red>"
veneer-info-title: "{prefix}<gold>Veneer</gold> <gray>Bericht für</gray> <white>{player}</white>{offline}"
veneer-info-offline: " <gray>(offline)</gray>"
veneer-info-client: "{prefix}<gray>Client:</gray> <white>{brand}</white> <gray>({type}, {channels} Kanäle)</gray>"
veneer-info-version: "{prefix}<gray>Version:</gray> <white>{claimed}</white> <gray>(Schild-Probe: {real})</gray>"
veneer-info-version-mismatch: "{prefix}<gray>Version:</gray> <white>{claimed}</white> <red>aber die Schild-Probe sagt {real}</red>"
veneer-info-status: "{prefix}<gray>Status:</gray> <white>{flags}</white>"
veneer-info-group: "{prefix}<gray>Gruppe:</gray> <white>{group}</white>"
veneer-info-bypass: "{prefix}<gray>Bypass {module}:</gray> <white>{when}</white> <gray>{source}</gray>"
veneer-info-bypass-always: "ja"
veneer-info-bypass-join: "nur beim Beitritt"
veneer-info-bypass-later: "nur nach dem Beitritt"
veneer-info-bypass-node: "({node})"
veneer-info-bypass-node-group: "({node}, Gruppe {group})"
veneer-scan-never: "{prefix}<gray>Mod-Scan:</gray> <white>nie gescannt</white>"
veneer-scan-line: "{prefix}<gray>Mod-Scan:</gray> <white>{when}</white> <gray>-</gray> {result} <gray>({count} Scans gespeichert)</gray>"
veneer-rp-none: "{prefix}<gray>RPTrack:</gray> <white>kein Fingerabdruck gespeichert</white>"
veneer-rp-line: "{prefix}<gray>RPTrack:</gray> <white>{packs} gecachte Packs</white> <gray>- verknüpfte Accounts:</gray> <white>{linked}</white>"
veneer-unknown: "unbekannt"
veneer-flag-bedrock: "Bedrock"
veneer-flag-spoof: "<red>durch Spoof-Erkennung markiert</red>"
veneer-scan-clean: "<green>sauber</green>"
veneer-scan-found: "<red>{found}</red>"
veneer-rp-linked-none: "keine"

# ======================================================================
# RPTRACK  /rptrack and staff report
# Placeholders: {label}, {player}, {mask}, {packs}, {linked}, {text}. {text} of rptrack-report is one of the rptrack-text-* lines; {players} there lists the linked accounts.
# ======================================================================
rptrack-disabled: "{prefix}<red>RPTrack ist deaktiviert (rptrack.enabled).</red>"
rptrack-usage: "{prefix}<red>Verwendung: /{label} \\<player></red>"
