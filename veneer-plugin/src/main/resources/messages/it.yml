# ======================================================================
# VENEER  /veneer info <player>
# Placeholders: {player}, {offline}, {brand}, {type}, {channels}, {flags}, {group}, {when}, {count}, {result}, {packs}, {linked}.
# The short 'words' (unknown, bedrock, none, clean) are put into the lines above.
# ======================================================================
veneer-info-usage: "{prefix}<red>Uso: /{label} info \\<player></red>"
veneer-info-title: "{prefix}<gold>Veneer</gold> <gray>report per</gray> <white>{player}</white>{offline}"
veneer-info-offline: " <gray>(offline)</gray>"
veneer-info-client: "{prefix}<gray>Client:</gray> <white>{brand}</white> <gray>({type}, {channels} canali)</gray>"
veneer-info-version: "{prefix}<gray>Versione:</gray> <white>{claimed}</white> <gray>(prova con cartello: {real})</gray>"
veneer-info-version-mismatch: "{prefix}<gray>Versione:</gray> <white>{claimed}</white> <red>ma la prova con cartello dice {real}</red>"
veneer-info-status: "{prefix}<gray>Stato:</gray> <white>{flags}</white>"
veneer-info-group: "{prefix}<gray>Gruppo:</gray> <white>{group}</white>"
veneer-info-bypass: "{prefix}<gray>Esenzione {module}:</gray> <white>{when}</white> <gray>{source}</gray>"
veneer-info-bypass-always: "sì"
veneer-info-bypass-join: "solo all'ingresso"
veneer-info-bypass-later: "solo dopo l'ingresso"
veneer-info-bypass-node: "({node})"
veneer-info-bypass-node-group: "({node}, gruppo {group})"
veneer-scan-never: "{prefix}<gray>Scansione mod:</gray> <white>mai scansionato</white>"
veneer-scan-line: "{prefix}<gray>Scansione mod:</gray> <white>{when}</white> <gray>-</gray> {result} <gray>({count} scansioni registrate)</gray>"
veneer-rp-none: "{prefix}<gray>RPTrack:</gray> <white>nessuna impronta salvata</white>"
veneer-rp-line: "{prefix}<gray>RPTrack:</gray> <white>{packs} pack in cache</white> <gray>- account collegati:</gray> <white>{linked}</white>"
veneer-unknown: "sconosciuto"
veneer-flag-bedrock: "bedrock"
veneer-flag-spoof: "<red>segnalato dal rilevamento spoof</red>"
veneer-scan-clean: "<green>pulito</green>"
veneer-scan-found: "<red>{found}</red>"
veneer-rp-linked-none: "nessuno"

# ======================================================================
# RPTRACK  /rptrack and staff report
# Placeholders: {label}, {player}, {mask}, {packs}, {linked}, {text}. {text} of rptrack-report is one of the rptrack-text-* lines; {players} there lists the linked accounts.
# ======================================================================
rptrack-disabled: "{prefix}<red>RPTrack è disabilitato (rptrack.enabled).</red>"
rptrack-usage: "{prefix}<red>Uso: /{label} \\<player></red>"
rptrack-none: "{prefix}<gray>Nessuna impronta salvata per</gray> <white>{player}</white><gray>.</gray>"
rptrack-cache: "{prefix}<white>{player}</white> <gray>cache:</gray> <white>{mask}</white> <gray>({packs} pack)</gray>"
rptrack-linked: "{prefix}<gray>Account collegati:</gray> <white>{linked}</white>"
rptrack-report: "{prefix}<gray>[RPTrack]</gray> <white>{player}</white><gray>:</gray> {text}"
rptrack-text-liquidbounce: "server HTTP locale di LiquidBounce (porta 15000) raggiungibile"
rptrack-text-same-cache: "stessa cache del client di: {players}"
rptrack-text-probably-same: "probabilmente lo stesso client (manca un pacchetto) di: {players}"

