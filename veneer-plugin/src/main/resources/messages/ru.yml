veneer-info-status: "{prefix}<gray>Статус:</gray> <white>{flags}</white>"
veneer-info-group: "{prefix}<gray>Группа:</gray> <white>{group}</white>"
veneer-info-bypass: "{prefix}<gray>Обход {module}:</gray> <white>{when}</white> <gray>{source}</gray>"
