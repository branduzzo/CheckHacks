# Veneer messages (en). Each section below is one part of the plugin.
# Texts are MiniMessage. Keep the {placeholders}; a key you delete falls back to en.yml.

# ======================================================================
# GENERAL
# Shared by every command. {prefix} is general.prefix from config.yml; {player}, {label} and similar are filled in by the plugin.
# ======================================================================
no-permission: "{prefix}<red>You don't have permission to do this."
player-not-found: "{prefix}<red>Player <white>{player} <red>not found."
reload-done: "{prefix}<green>Configuration reloaded."
alerts-enabled: "{prefix}<green>Alerts enabled."
alerts-disabled: "{prefix}<red>Alerts disabled."
bedrock-skip: "{prefix}<yellow>{player} <gray>is a Bedrock player - check skipped."
client-too-old: "{prefix}<yellow>{player} <gray>plays on {version}: sign checks need {min} or newer - check skipped."
module-not-running: "{prefix}<red>The {module} module is not running (check '{module}.enabled' in config.yml).</red>"
update-available: "{prefix}<green>Veneer {latest} is available</green> <gray>(running {current})</gray> <aqua><click:open_url:'{url}'>{url}</click></aqua>"

# ======================================================================
# MOD SCAN  (/hackcheck, join and anticheat checks)
# Placeholders: {player}. Scan results go to staff with veneer.alerts and to the player who started the scan.
# ======================================================================
check-started: "{prefix}<white>Starting check on <yellow><click:run_command:'/veneer player {player}'><hover:show_text:'<gray>Open profile'>{player}</hover></click><white>..."
check-complete: "{prefix}<white>Check complete for <yellow>{player}<white>:"
doublecheck: "{prefix}<yellow>DoubleCheck<gray>: <white>{player} <gray>flagged - running confirmation scan..."
anticheat-trigger: "{prefix}<gray>Anticheat flagged <yellow><click:run_command:'/veneer player {player}'><hover:show_text:'<gray>Open profile'>{player}</hover></click><gray>. Queuing auto-check..."
join-check: "{prefix}<gray>Auto-checking <yellow><click:run_command:'/veneer player {player}'><hover:show_text:'<gray>Open profile'>{player}</hover></click> <gray>on join..."
already-checking: "{prefix}<yellow>{player} <white>is already being checked."
invalid-hack: "{prefix}<red>Unknown hack: <white>{hack}"
hackcheck-usage: "{prefix}<red>Usage: /hackcheck \\<player> [hack1,hack2,...]</red>"
hackcheck-no-valid: "{prefix}<red>No valid hacks to check.</red>"

# ======================================================================
# MOD SCAN  (result block)
# check-result-line: {hack}, {result}. The result texts are shown as they are; the words match the values kept in the history database.
# check-nothing-found is shown when every mod was clean and hide-clean is on; check-channels shows {channels} when show-channels is on.
# ======================================================================
check-translation-header: "{prefix}<gray>  Translation Detect:"
check-result-line: "{prefix}  <white>{hack}<gray>: {result}"
result-detected: "<red>DETECTED"
result-not-detected: "<green>NOT_DETECTED"
result-protected: "<yellow>PROTECTED"
result-timeout: "<yellow>TIMEOUT"
result-skipped: "<gray>SKIPPED"
check-nothing-found: "{prefix}<green>    Nothing detected"
check-channels: "{prefix}<white>  Channels<gray>: <aqua>{channels}"
check-brand: "{prefix}<white>  Software<gray>: <yellow>{brand}"

# ======================================================================
# LANGUAGE CHECK  (/hacklang)
# Placeholders: {player}, {lang}, {response}.
# ======================================================================
hacklang-usage: "{prefix}<red>Usage: /hacklang \\<player> [lang1,lang2,...]</red>"
hacklang-unknown: "{prefix}<red>Unknown language: <white>{lang}</white></red>"
lang-check-started: "{prefix}<white>Checking language of <yellow>{player}<white>..."
lang-check-complete: "{prefix}<white>Language of <yellow>{player}<white>: <yellow>{lang} <gray>({response})"
lang-check-unknown: "{prefix}<white>Language of <yellow>{player}<white>: <red>Unknown <gray>({response})"
lang-check-protected: "{prefix}<white>Language of <yellow>{player}<white>: <yellow>PROTECTED"
version-mismatch: "{prefix}<red>{player}</red> <white>connects as <yellow>{claimed}</yellow> but the client is really <yellow>{real}</yellow> <gray>(ViaFabricPlus, ViaProxy or similar)"
