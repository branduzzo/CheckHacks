# ======================================================================
# VENEER  /veneer info <player>
# Placeholders: {player}, {offline}, {brand}, {type}, {channels}, {flags}, {group}, {when}, {count}, {result}, {packs}, {linked}.
# The short 'words' (unknown, bedrock, none, clean) are put into the lines above.
# ======================================================================
veneer-info-usage: "{prefix}<red>Utilisation : /{label} info \\<player></red>"
veneer-info-title: "{prefix}<gold>Veneer</gold> <gray>rapport pour</gray> <white>{player}</white>{offline}"
veneer-info-offline: " <gray>(hors ligne)</gray>"
veneer-info-client: "{prefix}<gray>Client :</gray> <white>{brand}</white> <gray>({type}, {channels} canaux)</gray>"
veneer-info-version: "{prefix}<gray>Version :</gray> <white>{claimed}</white> <gray>(test par panneau : {real})</gray>"
veneer-info-version-mismatch: "{prefix}<gray>Version :</gray> <white>{claimed}</white> <red>mais le test par panneau indique {real}</red>"
veneer-info-status: "{prefix}<gray>Statut :</gray> <white>{flags}</white>"
veneer-info-group: "{prefix}<gray>Groupe :</gray> <white>{group}</white>"
veneer-info-bypass: "{prefix}<gray>Contournement {module} :</gray> <white>{when}</white> <gray>{source}</gray>"
veneer-info-bypass-always: "oui"
veneer-info-bypass-join: "seulement à la connexion"
veneer-info-bypass-later: "seulement après la connexion"
veneer-info-bypass-node: "({node})"
veneer-info-bypass-node-group: "({node}, groupe {group})"
veneer-scan-never: "{prefix}<gray>Scan de mods :</gray> <white>jamais analysé</white>"
veneer-scan-line: "{prefix}<gray>Scan de mods :</gray> <white>{when}</white> <gray>-</gray> {result} <gray>({count} scans enregistrés)</gray>"
veneer-rp-none: "{prefix}<gray>RPTrack :</gray> <white>aucune empreinte enregistrée</white>"
veneer-rp-line: "{prefix}<gray>RPTrack :</gray> <white>{packs} packs en cache</white> <gray>- comptes liés :</gray> <white>{linked}</white>"
veneer-unknown: "inconnu"
veneer-flag-bedrock: "bedrock"
veneer-flag-spoof: "<red>signalé par la détection de spoof</red>"
veneer-scan-clean: "<green>propre</green>"
veneer-scan-found: "<red>{found}</red>"
veneer-rp-linked-none: "aucun"

# ======================================================================
# RPTRACK  /rptrack and staff report
# Placeholders: {label}, {player}, {mask}, {packs}, {linked}, {text}. {text} of rptrack-report is one of the rptrack-text-* lines; {players} there lists the linked accounts.
# ======================================================================
rptrack-disabled: "{prefix}<red>RPTrack est désactivé (rptrack.enabled).</red>"
rptrack-usage: "{prefix}<red>Utilisation : /{label} \\<player></red>"
rptrack-none: "{prefix}<gray>Aucune empreinte enregistrée pour</gray> <white>{player}</white><gray>.</gray>"
rptrack-cache: "{prefix}<white>{player}</white> <gray>cache :</gray> <white>{mask}</white> <gray>({packs} packs)</gray>"
rptrack-linked: "{prefix}<gray>Comptes liés :</gray> <white>{linked}</white>"
rptrack-report: "{prefix}<gray>[RPTrack]</gray> <white>{player}</white><gray>:</gray> {text}"
rptrack-text-liquidbounce: "serveur HTTP local de LiquidBounce (port 15000) joignable"
rptrack-text-same-cache: "même cache client que : {players}"
rptrack-text-probably-same: "probablement le même client (un pack manque) que : {players}"

