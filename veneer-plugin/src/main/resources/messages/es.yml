# Veneer messages (es). Each section below is one part of the plugin.
# Texts are MiniMessage. Keep the {placeholders}; a key you delete falls back to en.yml.

# ======================================================================
# GENERAL
# Shared by every command. {prefix} is general.prefix from config.yml; {player}, {label} and similar are filled in by the plugin.
# ======================================================================
no-permission: "{prefix}<red>No tienes permiso para hacer eso."
player-not-found: "{prefix}<red>Jugador <white>{player} <red>no encontrado."
reload-done: "{prefix}<green>Configuración recargada."
alerts-enabled: "{prefix}<green>Alertas activadas."
alerts-disabled: "{prefix}<red>Alertas desactivadas."
bedrock-skip: "{prefix}<yellow>{player} <gray>es un jugador Bedrock - revisión omitida."
client-too-old: "{prefix}<yellow>{player} <gray>juega en {version}: las comprobaciones con carteles necesitan {min} o más reciente - comprobación omitida."
module-not-running: "{prefix}<red>El módulo {module} no se está ejecutando (revisa '{module}.enabled' en config.yml).</red>"
update-available: "{prefix}<green>Veneer {latest} está disponible</green> <gray>(ejecutando {current})</gray> <aqua><click:open_url:'{url}'>{url}</click></aqua>"

# ======================================================================
# MOD SCAN  (/hackcheck, join and anticheat checks)
# Placeholders: {player}. Scan results go to staff with veneer.alerts and to the player who started the scan.
# ======================================================================
check-started: "{prefix}<white>Iniciando revisión de <yellow><click:run_command:'/veneer player {player}'><hover:show_text:'<gray>Open profile'>{player}</hover></click><white>..."
check-complete: "{prefix}<white>Revisión completada para <yellow>{player}<white>:"
doublecheck: "{prefix}<yellow>DoubleCheck<gray>: <white>{player} <gray>marcado - ejecutando escaneo de confirmación..."
anticheat-trigger: "{prefix}<gray>El anticheat ha detectado a <yellow><click:run_command:'/veneer player {player}'><hover:show_text:'<gray>Open profile'>{player}</hover></click><gray>. Iniciando revisión automática..."
join-check: "{prefix}<gray>Revisión automática de <yellow><click:run_command:'/veneer player {player}'><hover:show_text:'<gray>Open profile'>{player}</hover></click> <gray>al entrar..."
already-checking: "{prefix}<yellow>{player} <white>ya está en proceso de revisión."
invalid-hack: "{prefix}<red>Hack desconocido: <white>{hack}"
hackcheck-usage: "{prefix}<red>Uso: /hackcheck \\<player> [hack1,hack2,...]</red>"
hackcheck-no-valid: "{prefix}<red>No hay hacks válidos para comprobar.</red>"

# ======================================================================
# MOD SCAN  (result block)
# check-result-line: {hack}, {result}. The result texts are shown as they are; the words match the values kept in the history database.
# check-nothing-found is shown when every mod was clean and hide-clean is on; check-channels shows {channels} when show-channels is on.
# ======================================================================
check-translation-header: "{prefix}<gray>  Translation Detect:"
check-result-line: "{prefix}  <white>{hack}<gray>: {result}"
result-detected: "<red>DETECTED"
result-not-detected: "<green>NOT_DETECTED"
result-protected: "<yellow>PROTECTED"
result-timeout: "<yellow>TIMEOUT"
result-skipped: "<gray>SKIPPED"
check-nothing-found: "{prefix}<green>    Nada detectado"
check-channels: "{prefix}<white>  Canales<gray>: <aqua>{channels}"
check-brand: "{prefix}<white>  Software<gray>: <yellow>{brand}"

# ======================================================================
# LANGUAGE CHECK  (/hacklang)
# Placeholders: {player}, {lang}, {response}.
# ======================================================================
hacklang-usage: "{prefix}<red>Uso: /hacklang \\<player> [lang1,lang2,...]</red>"
hacklang-unknown: "{prefix}<red>Idioma desconocido: <white>{lang}</white></red>"
