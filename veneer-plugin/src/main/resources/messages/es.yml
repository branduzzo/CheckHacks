# ======================================================================
# VENEER  /veneer info <player>
# Placeholders: {player}, {offline}, {brand}, {type}, {channels}, {flags}, {group}, {when}, {count}, {result}, {packs}, {linked}.
# The short 'words' (unknown, bedrock, none, clean) are put into the lines above.
# ======================================================================
veneer-info-usage: "{prefix}<red>Uso: /{label} info \\<player></red>"
veneer-info-title: "{prefix}<gold>Veneer</gold> <gray>informe de</gray> <white>{player}</white>{offline}"
veneer-info-offline: " <gray>(desconectado)</gray>"
veneer-info-client: "{prefix}<gray>Cliente:</gray> <white>{brand}</white> <gray>({type}, {channels} canales)</gray>"
veneer-info-version: "{prefix}<gray>Versión:</gray> <white>{claimed}</white> <gray>(prueba con cartel: {real})</gray>"
veneer-info-version-mismatch: "{prefix}<gray>Versión:</gray> <white>{claimed}</white> <red>pero la prueba con cartel dice {real}</red>"
veneer-info-status: "{prefix}<gray>Estado:</gray> <white>{flags}</white>"
veneer-info-group: "{prefix}<gray>Grupo:</gray> <white>{group}</white>"
veneer-info-bypass: "{prefix}<gray>Exención {module}:</gray> <white>{when}</white> <gray>{source}</gray>"
veneer-info-bypass-always: "sí"
veneer-info-bypass-join: "solo al entrar"
veneer-info-bypass-later: "solo después de entrar"
veneer-info-bypass-node: "({node})"
veneer-info-bypass-node-group: "({node}, grupo {group})"
veneer-scan-never: "{prefix}<gray>Escaneo de mods:</gray> <white>nunca escaneado</white>"
veneer-scan-line: "{prefix}<gray>Escaneo de mods:</gray> <white>{when}</white> <gray>-</gray> {result} <gray>({count} escaneos registrados)</gray>"
veneer-rp-none: "{prefix}<gray>RPTrack:</gray> <white>sin huella almacenada</white>"
veneer-rp-line: "{prefix}<gray>RPTrack:</gray> <white>{packs} packs en caché</white> <gray>- cuentas vinculadas:</gray> <white>{linked}</white>"
veneer-unknown: "desconocido"
veneer-flag-bedrock: "bedrock"
veneer-flag-spoof: "<red>marcado por la detección de spoof</red>"
veneer-scan-clean: "<green>limpio</green>"
veneer-scan-found: "<red>{found}</red>"
veneer-rp-linked-none: "ninguna"

# ======================================================================
# RPTRACK  /rptrack and staff report
# Placeholders: {label}, {player}, {mask}, {packs}, {linked}, {text}. {text} of rptrack-report is one of the rptrack-text-* lines; {players} there lists the linked accounts.
# ======================================================================
rptrack-disabled: "{prefix}<red>RPTrack está desactivado (rptrack.enabled).</red>"
rptrack-usage: "{prefix}<red>Uso: /{label} \\<player></red>"
rptrack-none: "{prefix}<gray>No hay huella almacenada para</gray> <white>{player}</white><gray>.</gray>"
rptrack-cache: "{prefix}<white>{player}</white> <gray>caché:</gray> <white>{mask}</white> <gray>({packs} packs)</gray>"
rptrack-linked: "{prefix}<gray>Cuentas vinculadas:</gray> <white>{linked}</white>"
rptrack-report: "{prefix}<gray>[RPTrack]</gray> <white>{player}</white><gray>:</gray> {text}"
rptrack-text-liquidbounce: "servidor HTTP local de LiquidBounce (puerto 15000) accesible"
rptrack-text-same-cache: "misma caché de cliente que: {players}"
rptrack-text-probably-same: "probablemente el mismo cliente (falta un paquete) que: {players}"

